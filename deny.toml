# cargo-deny configuration for CodeWhale
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Scan all workspace members with all features
all-features = true

[advisories]
# Deny unmaintained and unsound crates
unmaintained = "all"
unsound = "all"
# Scoped maintenance exception; consumer and retirement criteria are documented
# in docs/dependency-maintenance.md. No vulnerability/unsoundness ignore is added.
ignore = [
    "RUSTSEC-2025-0141",  # bincode 1.3.3: syntect's embedded syntax/theme dumps
]

[bans]
# Duplicate versions warn without failing CI. Each skip below is a duplicate
# that survives because an upstream crate has not released a compatible
# version; a duplicate that is not listed surfaces as a new `cargo deny`
# warning. Remove a skip when the warning "skip was not encountered" or
# "applied to a crate with only one version" appears.
# - sha2 0.10 vs 0.11: oauth2 (0.10) vs schemaui 0.12 (0.11)
# - thiserror 1 vs 2: portable-pty 0.9 via filedescriptor 0.8 (v1) vs workspace v2
# - toml 0.8 vs 1.x, toml_edit 0.22 vs 0.25, winnow 0.7 vs 1.0, serde_spanned 0.6
#   vs 1.x: rust-i18n 4.2 (0.8 stack) vs workspace 1.x
multiple-versions = "warn"
wildcards = "deny"
skip = [
    { name = "sha2", version = "0.10.9" },
    { name = "thiserror", version = "1.0.69" },
    { name = "thiserror-impl", version = "1.0.69" },
    { name = "toml", version = "0.8.23" },
    { name = "toml_datetime", version = "0.6.11" },
    { name = "toml_edit", version = "0.22.27" },
    { name = "winnow", version = "0.7.14" },
    { name = "serde_spanned", version = "0.6.9" },
    { name = "core-foundation", version = "0.9.4" },
    { name = "itertools", version = "0.13.0" },
    { name = "security-framework", version = "2.11.1" },
    # Pinned to the versions actually in Cargo.lock so a NEW duplicate in this
    # family is flagged instead of skipped silently.
    { name = "windows-sys", version = "0.52.0" },
    { name = "windows-sys", version = "0.59.0" },
    { name = "windows-sys", version = "0.60.2" },
    { name = "windows-sys", version = "0.61.2" },
    { name = "windows-targets", version = "0.52.6" },
    { name = "windows-targets", version = "0.53.5" },
    { name = "windows_aarch64_gnullvm", version = "0.52.6" },
    { name = "windows_aarch64_gnullvm", version = "0.53.1" },
    { name = "windows_aarch64_msvc", version = "0.52.6" },
    { name = "windows_aarch64_msvc", version = "0.53.1" },
    { name = "windows_i686_gnu", version = "0.52.6" },
    { name = "windows_i686_gnu", version = "0.53.1" },
    { name = "windows_i686_msvc", version = "0.52.6" },
    { name = "windows_i686_msvc", version = "0.53.1" },
    { name = "windows_x86_64_gnu", version = "0.52.6" },
    { name = "windows_x86_64_gnu", version = "0.53.1" },
    { name = "windows_x86_64_gnullvm", version = "0.52.6" },
    { name = "windows_x86_64_gnullvm", version = "0.53.1" },
    { name = "windows_x86_64_msvc", version = "0.52.6" },
    { name = "windows_x86_64_msvc", version = "0.53.1" },
]
# For crates where the version is not the discriminator, use skip-tree to
# allow the duplicate tree regardless of version.
skip-tree = [
    { name = "portable-pty" },
    { name = "rust-i18n" },
    { name = "oauth2" },
]

[sources]
# Deny unknown registries and git sources
unknown-registry = "deny"
unknown-git = "deny"
# Allow only crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow git sources used by the project (add as needed)
allow-git = []

[licenses]
# Confidence threshold for license inference from text
confidence-threshold = 0.93
# Allowed licenses (MIT for CodeWhale, plus common transitive deps)
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# License exceptions for specific crates if needed
exceptions = []
