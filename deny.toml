# cargo-deny configuration for CodeWhale
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Scan all workspace members with all features
all-features = true

[advisories]
# Deny unmaintained and unsound crates
unmaintained = "all"
unsound = "all"
# Scoped exceptions; consumer and retirement criteria are documented in
# docs/dependency-maintenance.md.
ignore = [
    "RUSTSEC-2025-0141",  # bincode 1.3.3: syntect's embedded syntax/theme dumps
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 unmaintained notice only, no vulnerability; workspace-wide dependency with no safe upgrade during the 0.10.3 freeze; review by 2027-02-15 and migrate to jiff or time" },
    { id = "RUSTSEC-2026-0542", reason = "humantime 2.4.0 unmaintained only because it wraps chrono; reached solely via the cucumber 0.23 test-only dependency of codewhale-tui, which requires it; review by 2027-02-15 with the chrono migration" },
    # heapless 0.8.0 (RUSTSEC-2026-0574..0582): reached only as a non-optional
    # dependency edge of faster-hex 0.10.1 (<- gix-hash 0.28.1 <- gix 0.90.0,
    # the latest gix releases) for git object-id hex. gix-hash enables faster-hex's
    # std->alloc features, which compile out its sole heapless use behind
    # cfg(not(feature = "alloc")); none of the flagged APIs is reachable. No
    # fix exists in a compatible range: 0.8.0 is the sole 0.8.x release,
    # faster-hex 1.0.0 makes heapless optional but gix-hash requires ^0.10.1.
    # Assessment: docs/dependency-maintenance.md. Review by 2027-02-15.
    { id = "RUSTSEC-2026-0574", reason = "heapless 0.8.0 FindMutView::pop unreachable: sole dependent faster-hex compiles out all heapless use under its alloc feature, which gix-hash enables; no compatible fix (see deny.toml comment); review by 2027-02-15" },
    { id = "RUSTSEC-2026-0575", reason = "heapless 0.8.0 Spsc::peek unreachable: sole dependent faster-hex compiles out all heapless use under its alloc feature, which gix-hash enables; no compatible fix (see deny.toml comment); review by 2027-02-15" },
    { id = "RUSTSEC-2026-0576", reason = "heapless 0.8.0 IndexMap::truncate unreachable: sole dependent faster-hex compiles out all heapless use under its alloc feature, which gix-hash enables; no compatible fix (see deny.toml comment); review by 2027-02-15" },
    { id = "RUSTSEC-2026-0577", reason = "heapless 0.8.0 panicking-Drop UB path unreachable: sole dependent faster-hex compiles out all heapless use under its alloc feature, which gix-hash enables; no compatible fix (see deny.toml comment); review by 2027-02-15" },
    { id = "RUSTSEC-2026-0578", reason = "heapless 0.8.0 SortedLinkedList::zeroize unreachable: sole dependent faster-hex compiles out all heapless use under its alloc feature, which gix-hash enables; no compatible fix (see deny.toml comment); review by 2027-02-15" },
    { id = "RUSTSEC-2026-0579", reason = "heapless 0.8.0 Deque TryFrom impl unreachable: sole dependent faster-hex compiles out all heapless use under its alloc feature, which gix-hash enables; no compatible fix (see deny.toml comment); review by 2027-02-15" },
    { id = "RUSTSEC-2026-0580", reason = "heapless 0.8.0 treiber stack race unreachable: sole dependent faster-hex compiles out all heapless use under its alloc feature, which gix-hash enables; no compatible fix (see deny.toml comment); review by 2027-02-15" },
    { id = "RUSTSEC-2026-0581", reason = "heapless 0.8.0 Deque::make_contiguous unreachable: sole dependent faster-hex compiles out all heapless use under its alloc feature, which gix-hash enables; no compatible fix (see deny.toml comment); review by 2027-02-15" },
    { id = "RUSTSEC-2026-0582", reason = "heapless 0.8.0 IndexMap::insert unreachable: sole dependent faster-hex compiles out all heapless use under its alloc feature, which gix-hash enables; no compatible fix (see deny.toml comment); review by 2027-02-15" },
]

[bans]
# Duplicate versions warn without failing CI. Each skip below is a duplicate
# that survives because an upstream crate has not released a compatible
# version; a duplicate that is not listed surfaces as a new `cargo deny`
# warning. Remove a skip when `cargo deny check bans` reports an unmatched
# or unnecessary skip.
# - sha2 0.10 vs 0.11: oauth2 (0.10) vs schemaui 0.12 (0.11)
# - thiserror 1 vs 2: portable-pty 0.9 via filedescriptor 0.8 (v1) vs workspace v2
# - toml 0.8 vs 1.x, toml_edit 0.22 vs 0.25, toml_datetime 0.6 vs 1.x, winnow 0.7
#   vs 1.0, serde_spanned 0.6 vs 1.x: rust-i18n 4.2 (0.8 stack) vs workspace 1.x
# - core-foundation 0.9 vs 0.10, security-framework 2.11 vs 3.x: macOS TLS/cert
#   crates not yet unified on core-foundation 0.10 / security-framework 3
# - itertools 0.11 / 0.13 vs 0.14: rust-i18n (0.11) and transitive 0.13 consumers
multiple-versions = "warn"
wildcards = "deny"
skip = [
    { name = "sha2", version = "0.10.9" },
    { name = "thiserror", version = "1.0.69" },
    { name = "thiserror-impl", version = "1.0.69" },
    { name = "toml", version = "0.8.23" },
    { name = "toml_datetime", version = "0.6.11" },
    { name = "toml_edit", version = "0.22.27" },
    { name = "winnow", version = "0.7.15" },
    { name = "serde_spanned", version = "0.6.9" },
    { name = "core-foundation", version = "0.9.4" },
    { name = "itertools", version = "0.13.0" },
    { name = "security-framework", version = "2.11.1" },
    # Pinned to the versions actually in Cargo.lock so a NEW duplicate in this
    # family is flagged instead of skipped silently.
    { name = "windows-sys", version = "0.52.0" },
    { name = "windows-sys", version = "0.59.0" },
    { name = "windows-sys", version = "0.60.2" },
    { name = "windows-sys", version = "0.61.2" },
    { name = "windows-targets", version = "0.52.6" },
    { name = "windows-targets", version = "0.53.5" },
    { name = "windows_aarch64_gnullvm", version = "0.52.6" },
    { name = "windows_aarch64_gnullvm", version = "0.53.1" },
    { name = "windows_aarch64_msvc", version = "0.52.6" },
    { name = "windows_aarch64_msvc", version = "0.53.1" },
    { name = "windows_i686_gnu", version = "0.52.6" },
    { name = "windows_i686_gnu", version = "0.53.1" },
    { name = "windows_i686_msvc", version = "0.52.6" },
    { name = "windows_i686_msvc", version = "0.53.1" },
    { name = "windows_x86_64_gnu", version = "0.52.6" },
    { name = "windows_x86_64_gnu", version = "0.53.1" },
    { name = "windows_x86_64_gnullvm", version = "0.52.6" },
    { name = "windows_x86_64_gnullvm", version = "0.53.1" },
    { name = "windows_x86_64_msvc", version = "0.52.6" },
    { name = "windows_x86_64_msvc", version = "0.53.1" },
]
# For crates where the version is not the discriminator, use skip-tree to
# allow the duplicate tree regardless of version.
skip-tree = [
    { name = "portable-pty" },
    { name = "rust-i18n" },
    { name = "oauth2" },
]

[sources]
# Deny unknown registries and git sources
unknown-registry = "deny"
unknown-git = "deny"
# Allow only crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow git sources used by the project (add as needed)
allow-git = []

[licenses]
# Confidence threshold for license inference from text
confidence-threshold = 0.93
# Allowed licenses (MIT for CodeWhale, plus common transitive deps)
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# License exceptions for specific crates if needed
exceptions = []
