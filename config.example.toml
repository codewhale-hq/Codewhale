# base_url = "https://api.codewhale.net/v1"
# model = "deepseek/deepseek-v4-pro"        # provider/model exactly as the account catalog returns it

# ─────────────────────────────────────────────────────────────────────────────────
# Web Search Provider
# ─────────────────────────────────────────────────────────────────────────────────
# Choose which backend the Web tool's search uses. Default is keyless Firecrawl
# (bounded per-IP quota; `[search] api_key` or FIRECRAWL_API_KEY raises it).
# Bing and DuckDuckGo HTML scraping need no API key. Tavily, Bocha, Metaso,
# Baidu, Volcengine, Sofya, Serply and DeepSeek need an api_key; SearXNG needs
# base_url.
# API runtime failures and empty responses visibly degrade through DuckDuckGo
# then Bing. Missing configuration and network-policy denials fail closed.
#
# [search]
# provider = "firecrawl"   # firecrawl | bing | duckduckgo | tavily | bocha | metaso | searxng | baidu | volcengine | sofya | serply | deepseek
#                            # firecrawl:  Firecrawl Cloud search, keyless with a bounded per-IP quota
#                            # duckduckgo: HTML scrape with Bing fallback
#                            # bing:       HTML scrape, no API key
#                            # tavily:     https://tavily.com — AI search, needs api_key
#                            #             TAVILY_API_KEY set + provider unset auto-selects tavily
#                            #             at runtime; it is never written to config.toml
#                            # bocha:      https://bochaai.com — 博查AI搜索，国内友好，需api_key
#                            # metaso:     https://metaso.cn — 秘塔AI搜索，需 api_key
#                            #             设置 METASO_API_KEY 或 [search] api_key
#                            # searxng:    https://docs.searxng.org — trusted/self-hosted JSON API,
#                            #             set base_url; no public instance is used by default
#                            #             instance must enable JSON (settings.yml search.formats); HTML-only instances 403
#                            # baidu:      百度 AI Search via qianfan.baidubce.com，需 api_key
#                            # volcengine: 火山引擎 Ark web_search (免费 2 万次/月), 需 api_key
#                            #             也回退到 VOLCENGINE_API_KEY / VOLCENGINE_ARK_API_KEY / ARK_API_KEY 环境变量
#                            # sofya:      https://sofya.co — AI search returning full page
#                            #             content (not snippets), needs api_key (ay_live_...);
#                            #             also falls back to the SOFYA_API_KEY env var
#                            # serply:     https://serply.io Google organic results with
#                            #             snippets, needs api_key;
#                            #             also falls back to the SERPLY_API_KEY env var
#                            # deepseek:   https://api-docs.deepseek.com/guides/search —
#                            #             api.deepseek.com/v1/tools/search, needs api_key;
#                            #             also falls back to the DEEPSEEK_API_KEY env var
#                            #             (the saved model-provider key is not reused)
# base_url = "https://search.example/" # optional DuckDuckGo-compatible HTML endpoint;
#                                      # required SearXNG root or /search endpoint
# api_key = "YOUR_SEARCH_KEY" # required for tavily, bocha, metaso, baidu, volcengine, sofya, serply and deepseek; optional for firecrawl (raises the keyless quota); unused by searxng
#                             # WARNING: treat config.toml like a secret file when
#                             # storing API keys. Prefer env vars for local smoke tests.
#
# Env-var overrides:
#   CODEWHALE_SEARCH_PROVIDER → search.provider
#   DEEPSEEK_SEARCH_PROVIDER  → search.provider (legacy alias)
#   CODEWHALE_SEARCH_API_KEY  → search.api_key
#   DEEPSEEK_SEARCH_API_KEY   → search.api_key (legacy alias)
#   CODEWHALE_SEARCH_BASE_URL → search.base_url
#   DEEPSEEK_SEARCH_BASE_URL  → search.base_url (legacy alias)
#   FIRECRAWL_API_KEY         → firecrawl key fallback
#   METASO_API_KEY           → metaso key fallback
#   BAIDU_SEARCH_API_KEY     → baidu key fallback
#   VOLCENGINE_API_KEY / VOLCENGINE_ARK_API_KEY / ARK_API_KEY → volcengine key fallback
#   SOFYA_API_KEY            → sofya key fallback
#   SERPLY_API_KEY           → serply key fallback
#   TAVILY_API_KEY           → tavily autodetect when provider is unset (explicit
#                              provider = "..." or CODEWHALE_SEARCH_PROVIDER still
#                              wins; the autodetect is never persisted)

# ─────────────────────────────────────────────────────────────────────────────────
# Network Policy (#135)
# ─────────────────────────────────────────────────────────────────────────────────
# Per-domain allow/deny rules for outbound network calls made by the TUI's
# tools (`fetch_url`, `web_search`) and the MCP HTTP transport. Stdio MCP
# servers and direct LLM API calls are unaffected.
#
# Precedence: deny wins. A host listed in both `allow` and `deny` is denied.
#
# Host-matching rules:
#   - Exact match: `api.deepseek.com` matches only `api.deepseek.com`.
#   - Subdomain wildcard: an entry starting with `.` (e.g. `.example.com`)
#     matches `api.example.com` and `a.b.example.com` but not the apex
#     `example.com`. To cover both, list both. `*.example.com` is also accepted.
#
# Defaults are intentionally conservative: when this section is absent, no
# policy is enforced (mirrors pre-v0.7.0 behavior). To opt in:
#
# [network]
# default = "prompt"     # allow | deny | prompt
# allow = ["api.deepseek.com", "github.com", ".githubusercontent.com"]
# deny = []
# proxy = ["github.com", ".githubusercontent.com"]
# proxy_fake_ip_cidrs = ["198.18.0.0/15"] # requires both matching host and address
# audit = true            # one line per call to ~/.codewhale/audit.log

# ─────────────────────────────────────────────────────────────────────────────────
# Verifier preview (#2093)
# ─────────────────────────────────────────────────────────────────────────────────
# Enables automatic claim-of-done verifier preview once the runtime trigger is
# active. Manual `run_verifiers` remains available even when this is false.
#
# [verifier]
# enabled = false

# ─────────────────────────────────────────────────────────────────────────────────
# Advisor / Watcher (#3982)
# ─────────────────────────────────────────────────────────────────────────────────
# Optional background watcher that fires after each turn that contains tool
# calls. It reads a bounded slice of recent tool interactions, makes a concise
# LLM advisory call, and emits a brief note into the status area.
#
# Off by default.  Enable with `[advisor] enabled = true` or toggle per-session
# with `/advisor on` / `/advisor off`.
#
# Options (the full set — `AdvisorConfigToml` in crates/config/src/lib.rs):
#   enabled            — master switch (default: false)
#   max_tool_calls     — number of recent tool call/result pairs to read
#                        (default: 10, clamped to 1–50)
#   rate_limit_secs    — minimum seconds between successive advisor notes
#                        (default: 60, clamped to 5–3600)
#   dedup_window_secs  — notes whose content hash matches the previous note
#                        within this window are dropped (default: 300)
#   model              — model override for the advisory call; when absent the
#                        advisor reuses the session's current model
#
# Unknown keys under [advisor] are silently ignored, not rejected — a typo
# leaves the default in place with no error.
#
# [advisor]
# enabled = false
# max_tool_calls = 10
# rate_limit_secs = 60
# dedup_window_secs = 300
# model = "deepseek-v4-flash"

# ─────────────────────────────────────────────────────────────────────────────────
# Skills (#140)
# ─────────────────────────────────────────────────────────────────────────────────
# Settings for the `/skill install <spec>` community-skill installer.
#   * registry_url           — curated index.json that resolves bare names to
#                              `github:owner/repo` specs. Override to point at
#                              a private fork or internal mirror.
#   * max_install_size_bytes — per-skill uncompressed size cap. Tarballs that
#                              exceed this limit are rejected during validation.
#                              Default: 5 MiB.
#
# `/skill install` is gated by `[network]`. Make sure `github.com` and
# `raw.githubusercontent.com` are reachable (default `prompt` is fine — you'll
# be asked once and can persist) before running it.
#
# [skills]
# registry_url = "https://raw.githubusercontent.com/Hmbown/deepseek-skills/main/index.json"
# max_install_size_bytes = 5_242_880
# scan_codewhale_only = false # true: ignore Claude/OpenCode/Cursor/agentskills.io skill dirs
# flat_workspace_root = false # true: opt in to trusted <workspace>/skills content

# Model-stream budgets and HTTP transport. `config dump` shows effective values.
# Legacy [tui] stream_* keys remain fallbacks when a canonical field is absent.
[stream]
open_timeout_secs = 45      # response headers, including connect (0 = env/default, 5-300)
chunk_timeout_secs = 900    # per-SSE-chunk idle bound (0 = default, 1-3600)
max_resumes = 3             # whole-request reissues after failed streams (0 = off, 0-10)
max_transparent_retries = 2 # retry before any content (0 = off, 0-10)
max_stream_errors = 5       # recoverable errors per stream (0 = default, 1-50)
max_duration_secs = 1800    # one stream, not the whole turn (0 = default, 10-86400)
max_content_mb = 10         # one stream's content (0 = default, 1-512)
connect_timeout_secs = 30   # TCP/TLS setup (0 = default, 1-300)
force_http1 = false         # a truthy CODEWHALE_FORCE_HTTP1 still pins HTTP/1.1
# Keepalive settings apply to newly built model/catalog/fallback clients.
tcp_keepalive_secs = 30             # idle TCP probes (0 = off, 1-3600)
http2_keep_alive_interval_secs = 15  # active HTTP/2 PINGs (0 = off, 1-3600)
http2_keep_alive_timeout_secs = 20   # PING ACK deadline (0 = default, 1-3600)

# ─────────────────────────────────────────────────────────────────────────────────
# TUI
# ─────────────────────────────────────────────────────────────────────────────────
[tui]
alternate_screen = "auto"   # auto/always start on the alternate screen; never starts inline (keeps terminal scrollback). /fullscreen and /inline switch at runtime
mouse_capture = true        # true: TUI-owned mouse selection (payload set by selection_copy_markdown); false: raw terminal selection/copy
selection_copy_markdown = true # true: copy transcript drag selections as Markdown source; false: rendered text
# Model steps are uncapped by default. Uncomment to install an explicit
# ceiling; omission or 0 means no step limit, positive values clamp to 1-100000.
# max_model_steps = 1000
# A turn has no wall-clock limit unless you set one; omission or 0 means none.
# turn_wall_clock_secs = 7200  # cumulative wall clock for one turn, excluding
                               # time blocked on a human approval (30-86400)
osc8_links = true            # emit OSC 8 escapes around URLs (Cmd+click in iTerm2/Ghostty/Kitty/WezTerm/Terminal.app 13+); set false for terminals that misrender
# What the bottom chrome shows. Each key is one thing on screen: `mode` is the
# posture bar's plan/act/operate chip, everything else is a segment of the
# metrics line under it. Omit the key to use the built-in default; set [] to
# strip the metrics line down to the help hint. You can also edit this
# interactively with `/statusline`.
# Supported keys: mode, model, context_percent, cost,
# balance (prepaid providers only: DeepSeek, DeepSeekCN, OpenRouter,
# SiliconFlow), cache, tokens, ttft, output_rate, workspace, git_branch.
# Legacy session_metrics enables both ttft and output_rate.
# Retired in 0.9.13: status, agents, reasoning_replay, prefix_stability,
# last_tool_elapsed, rate_limit — they drove nothing. Old files
# keep loading; the retired keys are ignored.
# status_items = ["mode", "model", "context_percent", "cost", "tokens"]
# Size presets for the two rows themselves (#5950) — composition stays in
# status_items; these only decide how much of a row paints:
# posture_bar = "full"          # full | compact | hidden (default full)
#                               # compact keeps the posture chips (and the cap
#                               # warning) and drops the clocks, counts and hint;
#                               # hidden gives the row to the transcript.
# metrics_line = "compact"      # full | compact | hidden (default compact)
#                               # compact keeps the route, context reading, cost
#                               # and balance plus selected TTFT/rate when they fit.
#                               # It drops secondary counts and help; hidden gives the row to the transcript.
#                               # Also settable at runtime: /config posture_bar compact
# notification_condition = "unfocused" # unfocused | always | never
#                                    "unfocused" = notify only after this terminal has been
#                                    in the background for two seconds (default);
#                                    "always"    = allow configured notifications while focused;
#                                                  successful turns skip the threshold;
#                                    "never"     = suppress all operator notifications.
# locale = "auto"           # UI chrome language: auto | en | ja | zh-Hans | zh-Hant | pt-BR | es-419
#                           # | vi | ko | ca | de | fr | id | hi | ru | uk
#                           # "auto" reads LC_ALL → LC_MESSAGES → LANG; falls back to English.
#                           # Override: `locale = "zh-Hans"` for Simplified Chinese regardless of OS locale.
#                           # Also settable at runtime: /config locale zh-Hans
#                           # Note: this only affects TUI labels/chrome — it does NOT change model output language.
# mention_menu_behavior = "fuzzy" # fuzzy | browser; browser lists immediate directory children for @-mentions.

# ─────────────────────────────────────────────────────────────────────────────────
# Transcript
# ─────────────────────────────────────────────────────────────────────────────────
# Prose — user messages, assistant answers, and reasoning/thinking — fills the
# full content width, consistent with tool/status cells and the wide-frame
# decision in #5322 (#5436). Owners who want a bounded reading measure on
# ultrawide terminals can cap it in columns.
[transcript]
# prose_measure = 120   # positive integer: cap prose wrap at N columns.
                        # 0 or absent = full content width (default).
                        # Must be a positive whole number; tool, diff, and
                        # status cells always keep the full content width.

# ─────────────────────────────────────────────────────────────────────────────────
# Feature Flags
# ─────────────────────────────────────────────────────────────────────────────────
[features]
shell_tool = true
subagents = true
web_search = true # enables canonical web.run plus the compatibility web_search alias
apply_patch = true
mcp = true
exec_policy = true
code_mode = true # execute_tools composes MCP/plugin/native calls; false defers it behind tool_search
# vision_model = false  # enable vision model for image_analyze tool
# verify_tool = false   # disable the agent-callable `verify` self-critique tool
                        # (#4196). On by default; the agent decides when to spend
                        # the extra reasoning, so cost is only incurred on demand.
                        # Set false to remove it from the model's tool catalog.
# extension_host = false # EXPERIMENTAL. Run reviewed plugins' `native` host code
                        # (TypeScript/JavaScript, Cordis/DSH plugin model) in a
                        # separate Node.js (or, opt-in, Bun) process. Tools and
                        # slash commands in this phase. Every
                        # extension tool is always Required and never
                        # read-only; like any Required tool it runs without
                        # a prompt under Full Access, under Bypass, or with a
                        # matching session grant, which is bound to the
                        # plugin's reviewed build (an update asks again).
                        # Native code requires a verified OS sandbox: Seatbelt
                        # on macOS, bubblewrap on Linux, and LPAC/Job on Windows.
                        # An unavailable Native sandbox refuses activation.
                        # Unix reads are limited to the selected runtime and
                        # libraries, canonical host bundle, captured Core-managed
                        # plugin stores and Native data. Writes stay in Native
                        # data and private scratch; repository reads and direct
                        # network are denied. Native plugins share one trusted
                        # cohort, not separate per-plugin OS sandboxes.
                        # On macOS a detached child can outlive process-group
                        # cancellation while retaining the sandbox restrictions.
                        # Builtin host policy is separate and diagnosed separately.
                        # Toggling this changes the plugin activation policy,
                        # so every plugin must be re-reviewed afterwards.

# [extension_host]
# runtime = "node"              # "node" (default), "bun" or "auto". Bun is an
#                               # opt-in, qualified on macOS only. "auto" uses
#                               # Bun >= 1.4.0 when one is found and starts,
#                               # else Node. "bun"/"node" never fall back.
#                               # Unset with only `bun` set: "bun".
# bun = "~/.bun/bin/bun"        # Bun >= 1.4.0. When set, the only Bun tried; a
#                               # broken one fails instead of searching PATH and
#                               # $BUN_INSTALL/bin or ~/.bun/bin.
# node = "/usr/local/bin/node"  # Node.js ^22.19 || >=24. When set, the only Node
#                               # tried. Unset, every `node` on PATH is tried in
#                               # order, skipping any inside node_modules or the
#                               # working directory.

# Per-plugin settings for the extension host, keyed by the plugin's manifest
# name. The table is delivered to the plugin's `apply(ctx, config)` and checked
# against the plugin's own `Config` schema, if it declares one. User config
# only: a project's .codewhale/config.toml cannot set it. Read at start and at
# `/plugin reload`, which re-activates a plugin whose table changed. At most
# 16 KiB of plain TOML values; `/plugin show <name>` lists the keys, not the
# values. Do not store secrets here: the plugin's code reads every value.
#
# [plugins."hello-extension".config]
# greeting = "Howdy"

# ─────────────────────────────────────────────────────────────────────────────────
# Vision Model Configuration (optional)
# ─────────────────────────────────────────────────────────────────────────────────
# Uses an OpenAI-compatible vision model API for the `image_analyze` tool.
# api_key inherits from the main config if not specified.
#
# [vision_model]
# model = "gemini-3.1-flash-lite-preview"  # Required: vision-capable model ID
# api_key = "YOUR_API_KEY"                 # Optional: defaults to main api_key
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"  # Optional
#
# Xiaomi MiMo image understanding can be configured through the same tool:
# model = "mimo-v2.6-flash"
# api_key = "YOUR_XIAOMI_KEY"
# base_url = "https://token-plan-sgp.xiaomimimo.com/v1"  # Token Plan / tp- keys

# ─────────────────────────────────────────────────────────────────────────────────
# Retry Configuration
# ─────────────────────────────────────────────────────────────────────────────────
[retry]
enabled = true
max_retries = 3
initial_delay = 1.0
max_delay = 60.0
exponential_base = 2.0
# jitter = true                 # randomize each backoff delay
# jitter_factor = 0.1           # ±10% spread (0.0-1.0)
# respect_retry_after = true    # honor a server Retry-After header

# ─────────────────────────────────────────────────────────────────────────────────
# Goal loop (`[goal]`) — operate-mode persistent goals
# ─────────────────────────────────────────────────────────────────────────────────
# Operate-mode goals run to their completion gate with no default token, time,
# or continuation ceiling. Token/time budgets, when supplied, are telemetry
# only and do not stop a goal. The keys below are the opt-in circuit breakers.
# [goal]
# Optional safety backstop on automatic goal continuation passes.
# Default: 0 (unlimited). Set a positive value to opt into a ceiling.
# max_continuations = 100
# Optional cancellable quiet period between successful turns, useful for
# coordinator goals that poll on a cadence instead of keeping one provider
# turn open. Default: 0 (continue immediately). Cap: 86400 (24h).
# continuation_delay_seconds = 300
# Per-turn step allowance while a goal is active (#5994): larger but still
# finite. Default: 1000 (0/absent resolves to 1000). Range: 1..=100,000.
# Bounds each turn, never the number of continuation passes; explicit
# per-invocation ceilings (exec --max-turns, worker caps) always win.
# max_steps = 1000

# ─────────────────────────────────────────────────────────────────────────────────
# Context Compaction
# ─────────────────────────────────────────────────────────────────────────────────
# Auto-compaction is a saved UI setting edited with `/config` (`auto_compact`).
# The optional saved threshold setting is `auto_compact_threshold_percent`
# (default 80). There is no config-file
# `[compaction]` table yet; runtime compaction budgets are chosen by the TUI
# from the active model/context window.

# [context] supports one key, `project_pack` (default false, #4781). The
# removed seam-manager keys (enabled, verbatim_window_turns, l1/l2/l3_threshold,
# seam_model) are ignored if an older config still carries them.

# ─────────────────────────────────────────────────────────────────────────────────
# Workshop / Tool-Output Budgets
# ─────────────────────────────────────────────────────────────────────────────────
# By default an oversized tool result uses bounded spillover: a result under the
# byte threshold stays inline, a larger one gets a head/tail preview plus a
# session artifact the model can read back. There is no synthesis sub-agent and
# no per-call `raw = true` escape.
#
# `large_output_threshold_tokens` and `[workshop.per_tool_thresholds]` only take
# effect when the process opts in to adaptive evidence routing with
# `CODEWHALE_ADAPTIVE_OUTPUT_ROUTING=1`; they set where a result stops being
# inline and becomes handle-only evidence. Per-tool keys are exact tool names as
# the model sees them (`bash`, `fetch_url`, ...). The two byte ceilings below
# apply either way.
#
# [workshop]
# large_output_threshold_tokens = 4096
# # Optional model-visible byte ceilings (#5367). Absent keeps the
# # compile-time defaults (read 50KiB / read_file 16KiB, then the
# # compact 12K-char floor). Values raise the floor; they never lower
# # it. Hard cap is 2MiB.
# # read_result_max_bytes = 102400
# # tool_result_max_bytes = 102400
# [workshop.per_tool_thresholds]   # adaptive routing only
# bash      = 2048     # shell output becomes handle-only evidence sooner
# fetch_url = 8192     # web pages can be large; give them more room

# ─────────────────────────────────────────────────────────────────────────────────
# Profile Example (for multiple environments)
# ─────────────────────────────────────────────────────────────────────────────────
# Select a profile with `deepseek --profile <name>` or `DEEPSEEK_PROFILE=<name>`.
# A profile's provider tables override the same fields of the base tables.
[profiles.work.providers.deepseek]
api_key = "WORK_DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com/beta"

[profiles.dev]
allow_shell = true

[profiles.dev.providers.deepseek]
api_key = "DEV_DEEPSEEK_API_KEY"

[profiles.nvidia-nim]
provider = "nvidia-nim"
default_text_model = "deepseek-ai/deepseek-v4-pro"

[profiles.nvidia-nim.providers.nvidia_nim]
api_key = "YOUR_NVIDIA_API_KEY"
base_url = "https://integrate.api.nvidia.com/v1"

# ─────────────────────────────────────────────────────────────────────────────────
# Desktop Notifications (OSC 9 / BEL on long agent-turn completion)
# ─────────────────────────────────────────────────────────────────────────────────
# Emits an escape sequence to the terminal when a turn **completes successfully**
# and took longer than `threshold_secs`. Failed or cancelled turns are
# intentionally silent. Useful when you tab away from the TUI and want an alert
# for "your task is ready".
#
# method        = "auto"   # auto | osc9 | kitty | ghostty | bel | off
#                 auto: native/terminal banner for known terminals.
#                       On macOS, the native banner is silent; on Linux,
#                       unknown terminals stay silent instead of ringing BEL.
#                 osc9: \x1b]9;<msg>\x07 (iTerm2-style; shows macOS notification)
#                 bel:  explicit \x07 beep (MessageBeep on Windows)
#                 off:  disable banners; an explicit completion sound is independent
# threshold_secs = 30      # only notify when the turn took >= this many seconds
# include_summary = false  # include elapsed time + cost in the notification body
# subagent_completion = "final-only" # always | final-only | off — notices when
#                          background work finishes: sub-agents, background
#                          shells and durable tasks. final-only (default) sends
#                          one notice naming everything that finished once no
#                          agent, workflow or durable task is still running (a
#                          running shell such as a dev server never holds it
#                          back); off silences them entirely.
# completion_sound = "off" # off | beep | bell | file — opt-in turn-completion sound
# sound_file = "E:\\google\\downloads\\notify.wav" # WAV used when completion_sound = "file" (Windows)
[notifications]
# method = "auto"
# threshold_secs = 30
# include_summary = false
# subagent_completion = "final-only"
# completion_sound = "off"
# sound_file = "E:\\google\\downloads\\notify.wav"

# Lifecycle event outbox: opt-in JSONL stream of session/turn/subagent
# lifecycle events for supervisors and automation harnesses. One JSON line
# per event (RuntimeEventEnvelope schema), appended and flushed on every
# emit; seq is monotonic per file and recovers from the last line on open.
# UNCOMMENT `path` TO ENABLE — unset/empty = OFF = behavior unchanged.
# Fires for interactive TUI sessions AND headless `codewhale exec` runs.
# See docs/CONFIGURATION.md → Lifecycle Outbox for the file contract.
# [lifecycle_outbox]
# path = "~/.codewhale/notifications/outbox.jsonl"
# webhook_url = "https://example.com/hooks/codewhale" # optional: POST {"at", "event"} JSON per event
# webhook_token = ""            # optional: sent as `Authorization: Bearer <token>`
#                               # delivery is best-effort: failures are logged and dropped

# Opt-in per-event sound cues (#4817): deterministic, terminal-bell level
# (BEL bytes only — functional signals, platform-safe no-op when the terminal
# ignores BEL). Off by default. When completion_sound is active, turn-complete
# is left to that channel so the two never double-ding.
# [notifications.event_sound]
# enabled = false                                # master switch, default off
# events = ["turn-complete", "approval-needed"]  # allow-list; unknown names ignored
# min_interval_ms = 2000                         # per-event rate limit
# quiet = false                                  # true silences all event sounds

# ─────────────────────────────────────────────────────────────────────────────────
# Workspace Snapshots (#137)
# ─────────────────────────────────────────────────────────────────────────────────
# Each turn the TUI takes a `pre-turn:<seq>` and `post-turn:<seq>` snapshot of
# your workspace into a side-git repo at:
#
#     ~/.codewhale/snapshots/<project_hash>/<worktree_hash>/.git
#
# Your own `.git` is never touched — `--git-dir` and `--work-tree` are always
# set together when shelling out to git. Use `/restore N` (slash command) or
# the `revert_turn` tool to roll the working tree back. Conversation history
# is unaffected.
#
# Disk footprint: ~1-2 GB worst case for a 100 MB workspace × 12 turns/day,
# typically far less thanks to git's content-addressed storage. The session
# boot prunes anything older than `max_age_days` (default 7).
#
# [snapshots]
# enabled = true        # Snapshot workspace pre/post each turn for /restore
# max_age_days = 7      # Older snapshots pruned at session start
# max_workspace_gb = 2  # Snapshots self-disable on first init when the
#                         # non-excluded workspace exceeds this size in GB
#                         # (v0.8.32). Default 2 GB protects against running
#                         # codewhale in directories with hundreds of GB
#                         # of datasets / model weights / docker dumps where
#                         # `git add -A` would hang the TUI for hours. Set
#                         # to 0 to disable the cap (v0.8.31 behaviour);
#                         # raise to a higher number for legitimate large
#                         # monorepos.

# ─────────────────────────────────────────────────────────────────────────────────
# LSP Diagnostics (post-edit) (#136)
# ─────────────────────────────────────────────────────────────────────────────────
# After every successful file edit (`edit_file`, `apply_patch`, `write_file`),
# the engine asks an LSP server for diagnostics on the file and injects them
# as a synthetic system message before the next API call. This lets the agent
# see compile breaks immediately without round-tripping through the user.
#
# Enabled by default. Failure modes are non-blocking: a missing LSP binary,
# a crashed server, or a timeout simply skips the post-edit hook for that
# turn — the agent's work is never blocked.
#
# Built-in language → server defaults:
#   rust       → rust-analyzer
#   go         → gopls serve
#   python     → pyright-langserver --stdio
#   typescript → typescript-language-server --stdio
#   java       → jdtls
#   php        → intelephense --stdio
#   vue        → vue-language-server --stdio
#   c, cpp     → clangd
#
# Java support uses Eclipse JDT LS via the `jdtls` command. IntelliJ IDEA is
# not required, and installing IntelliJ IDEA alone does not install `jdtls`.
#
# Override the defaults via the `servers` table below.
#
# For languages not in the built-in list (Ruby, C#, Swift, etc.), use
# `[lsp.custom.<ext>]` to register a language server:
#
# [lsp.custom.rb]
# command = "ruby-lsp"
# args = ["--stdio"]
# language_id = "ruby"
#
# [lsp.custom.cs]
# command = "csharp-ls"
# args = []
# language_id = "csharp"
#
# [lsp.custom.swift]
# command = "sourcekit-lsp"
# language_id = "swift"
[lsp]
# enabled = true
# poll_after_edit_ms = 5000
# max_diagnostics_per_file = 20
# include_warnings = false
# [lsp.servers]
# rust = ["rust-analyzer"]
# go = ["gopls", "serve"]
# java = ["jdtls"]
# php = ["intelephense", "--stdio"]
# vue = ["vue-language-server", "--stdio"]

# ─────────────────────────────────────────────────────────────────────────────────
# Hooks (optional)
# ─────────────────────────────────────────────────────────────────────────────────
# Hooks run shell commands on lifecycle events (session start/end, tool calls, etc.).
# Configure as `[[hooks.hooks]]` under a `[hooks]` table.
#
# SCOPE: hooks are a TUI runtime feature. They fire from the interactive TUI
# and the engine turn loop it drives. `codewhale exec`, the CLI subcommands,
# the app-server / ACP surfaces, and the `workflow` tool do NOT fire them.
#
# Available events (all 11): session_start, session_end, message_submit,
# tool_call_before, tool_call_after, mode_change, on_error, turn_end,
# subagent_spawn, subagent_complete, shell_env.
# See docs/HOOKS.md for the per-event payload, env var, and steering contract.
#
# `message_submit`, `tool_call_before`, and `shell_env` are the only events
# whose result can change what Codewhale does. The rest are observer-only —
# which means their RESULT is ignored, not that the command is harmless. Every
# hook is an arbitrary shell command running with your credentials.
#
# Note: `default_timeout_secs` below OVERRIDES each hook's own `timeout_secs`.
# Leave it unset if you want per-hook timeouts to apply. `/hooks list` shows the
# effective value and names the override. `default_timeout_secs = 0` is
# REJECTED at load — it would expire every hook immediately — and per-hook
# `timeout_secs` applies instead. The timeout applies to background hooks too:
# on expiry the whole process group is killed and then reaped, best-effort,
# with a bounded reap wait (see docs/HOOKS.md → Timeouts).
#
# `background = true` means submitted and never awaited. The hook still gets
# the documented stdin payload, environment, and timeout — it just has no exit
# code, so it cannot steer. `shell_env` ignores the flag and always runs in the
# foreground because its stdout is the contract.
#
# A condition that references context its event never carries is REJECTED at
# load, logged, and shown by `/hooks list` — for example an `exit_code`
# condition outside `tool_call_after` / `on_error`, or a `mode` condition on
# `shell_env`. Rejection is per entry: a broken hook never drops another one
# that happens to share its name. `on_error` fires for tool failures with the
# tool name, call id, and reported exit code attached, so tool-scoped and
# exit-code-scoped `on_error` hooks are supported.
#
# `shell_env` (#456) is special: the hook runs immediately before each
# `exec_shell` invocation and its stdout is parsed as `KEY=VALUE\n` lines.
# Those vars are applied on top of `exec_shell`'s environment. For LOCAL
# execution that environment is built from a fixed allowlist of parent
# variables (PATH, HOME, LANG, TERM, …) — an ambient secret exported in your
# terminal is NOT forwarded to `exec_shell` by itself, so this hook is the
# supported way to supply one. If an external sandbox backend is configured,
# that allowlist does NOT apply: the backend owns its base environment and your
# `shell_env` values are TRANSMITTED to it. Later hooks override
# earlier ones. Use this for ephemeral credentials, per-skill PATH adjustments,
# or short-lived tokens. The resolved KEY names (NEVER values) are written to
# `~/.codewhale/audit.log` so each session can be reconciled later. Hook
# failure / timeout simply contributes no vars — it does not abort the shell
# call.
#
# [hooks]
# enabled = true
# default_timeout_secs = 30
#
# [[hooks.hooks]]
# event = "session_start"
# command = "echo 'Codewhale session started'"
#
# # Inject ephemeral creds into every shell call. Output one
# # KEY=VALUE per line on stdout (export prefix optional).
# [[hooks.hooks]]
# name = "aws-creds"
# event = "shell_env"
# command = "aws-vault export my-profile --format=env"
# # Optionally limit to specific tool names / categories:
# # condition = { type = "tool_category", category = "shell" }
#
# # Observe sub-agent lifecycle events. These hooks receive bounded JSON
# # metadata on stdin and are warn-only: failures do not affect sub-agent
# # scheduling, prompts, or results. continue_on_error has no effect for
# # these observer events; later matching hooks always continue.
# [[hooks.hooks]]
# name = "subagent-audit"
# event = "subagent_complete"
# command = "~/.codewhale/hooks/subagent-audit.sh"

# ─────────────────────────────────────────────────────────────────────────────────
# Runtime API (`deepseek serve --http`) (#561)
# ─────────────────────────────────────────────────────────────────────────────────
# Tuning knobs for the local HTTP/SSE daemon. The server binds to 127.0.0.1
# by default and is intended for local UIs (whalescale-desktop, dashboards,
# automation scripts). Today this section only controls the CORS allow-list;
# host/port/workers stay on `--host`, `--port`, and `--workers` flags.
#
# Built-in defaults always include:
#   http://localhost:3000   http://127.0.0.1:3000
#   http://localhost:1420   http://127.0.0.1:1420
#   tauri://localhost
#
# Use `cors_origins` to add extra dev origins (e.g. Vite's default `:5173`).
# User entries STACK on top of the defaults — they do not replace them. The
# CLI flag `--cors-origin URL` (repeatable) and env var
# `DEEPSEEK_CORS_ORIGINS=url1,url2` resolve to the same merged list.
#
# [runtime_api]
# cors_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

# ─────────────────────────────────────────────────────────────────────────────────
# Tool Overrides & Plugins ([tools])
# ─────────────────────────────────────────────────────────────────────────────────
# The `[tools]` table lets you disable any built-in tool, or add your own
# tool backed by a script or command — without forking or recompiling the
# binary. A script or command cannot replace a built-in: an override keyed by
# a built-in name is refused (logged) and the built-in stays active.
#
# Plugin scripts dropped in the plugin directory are auto-discovered and
# registered as model-visible tools alongside the built-in ones. A script may
# declare `# approval: suggest` (the default) or `# approval: required`;
# `# approval: auto` is no longer supported and falls back to the default.
#
# Scripts receive the tool's JSON input on **stdin** and must return a
# JSON `ToolResult` (`{"content": "...", "success": true}`) on **stdout**.
#
# [tools]
# # Custom plugin directory (defaults to `~/.codewhale/tools/`)
# plugin_dir = "~/.codewhale/tools"
#
# [tools.overrides]
# # Disable a tool entirely — removes it from the model-visible catalog.
# "Web" = { type = "disabled" }
#
# # Add a tool backed by a script. Relative paths resolve against plugin_dir.
# "audited_shell" = { type = "script", path = "audit-shell.sh" }
#
# # Add a tool backed by a command (binary on PATH or absolute path).
# "bat_reader" = { type = "command", command = "bat", args = ["--paging=never"] }
#
# # Scripts can also accept static arguments before the JSON input:
# "cached_fetch" = { type = "script", path = "cached-fetch.sh", args = ["--ttl", "300"] }

# ──────────── Enterprise example: audit-logging shell wrapper ──────────────
# Drop `audit-shell.sh` (below) in `~/.codewhale/tools/`, where it registers
# itself as `audited_shell`, and turn the built-in shell off (`Bash` and its
# lowercase `bash` form). Other shell-capable tools, such as the terminal
# tools, stay available; disable them too if every command must pass the
# wrapper.
#
# [tools.overrides]
# "Bash" = { type = "disabled" }
# "bash" = { type = "disabled" }
#
# The wrapper logs every request to `~/.codewhale/audit/shell.log`, then
# delegates to your own approved shell executor. Do not pipe the raw JSON
# request into `sh -s`; parse the command field and enforce your policy first.
#
# ```sh
# #!/usr/bin/env sh
# # name: audited_shell
# # description: Audit-logging shell wrapper
# # approval: required
# LOGDIR="${HOME}/.codewhale/audit"
# mkdir -p "$LOGDIR"
# LOGFILE="$LOGDIR/shell.log"
# input=$(cat)
# echo "[$(date -Iseconds)] $input" >> "$LOGFILE"
# printf '%s\n' '{"content":"audit wrapper dry run: configure an executor","success":false}'
# ```

# ─────────────────────────────────────────────────────────────────────────────────
# Workflow automatic launch, approval, isolation, and activity (#4128)
# ─────────────────────────────────────────────────────────────────────────────────
# First-class knobs for automatic Workflow orchestration. When the table is
# omitted entirely, the runtime uses these product defaults. Later launch,
# approval, and activity-persistence paths all read through this one model.
# [workflow]
# # Allow the parent agent to auto-launch Workflow for multi-agent work.
# # Set false to require an explicit `/workflow` opt-in.
# automatic = true
# # Auto-start read-only plans without an approval card when automatic is on.
# auto_start_read_only = true
# # Require an approval card before write/shell/network/high-budget launches.
# require_approval_for_writes = true
# # Optional owner-selected total child limit. Zero leaves work uncapped.
# max_children = 0
# # Maximum concurrently live agents inside one run (others wait for a slot).
# max_concurrent = 16
# # Optional structural Workflow depth limit; zero leaves it uncapped.
# # This is separate from Runtime child delegation below.
# max_depth = 0
# # Legacy token hint retained in receipts; not metered or enforced.
# default_token_budget = 0

# ─────────────────────────────────────────────────────────────────────────────────
# Agent Fleet roster, role registry, and execution requests (#3165, #3167)
# ─────────────────────────────────────────────────────────────────────────────────
# [fleet]
# # Fleet stores member identity and route intent. Project trust, host identity,
# # secrets, approvals, sandboxing, filesystem/network reach, and tool authority
# # are Runtime policy and are deliberately not configured here. Pre-0.9.11
# # trust keys are accepted only as ignored migration input.
#
# # Headless worker execution hardening (#3027)
# [fleet.exec]
# # Tools always allowed regardless of role
# allowed_tools = []
# # Tools always disallowed (overrides role and task spec)
# disallowed_tools = ["exec_shell"]
# # Optional hard ceiling on worker steps (tool calls + model turns).
# # Omit or set 0 for the unbounded default; use a positive value to opt in.
# max_turns = 500
# # Runtime child-agent depth for fleet workers. Shares ONE recursion axis with
# # standalone sub-agents (a fleet worker IS a headless sub-agent). This is an
# # execution request, not Fleet member identity. 0 blocks child agents (the
# # root worker still runs); omit to leave depth uncapped.
# max_spawn_depth = 3
# # Extra system prompt injected into every headless worker
# append_system_prompt = "Never modify .git/config or change remotes."
# # Output format: "text" (default) or "stream-json" for ndjson events
# output_format = "text"
#
# # Fleet profiles define named agent configurations the roster can dispatch.
# # Built-in profiles are always available: manager, operator, scout, builder,
# # reviewer, verifier, synthesizer, general. User-defined profiles under
# # [fleet.profiles] override or extend the built-in set by id. Precedence
# # is Workspace (.codewhale/agents/*.toml) > Config ([fleet.profiles]) > BuiltIn.
# # See /fleet setup for an in-app profile-authoring wizard.
# [fleet.profiles.ci-linter]
# slot = "verifier"
# loadout = "fast"
# model = "deepseek-v4-pro"
#
# [fleet.profiles.ci-linter.role]
# name = "CI Linter"
# description = "Runs linters and formatters"
# instructions = "Run cargo fmt --check and cargo clippy; never apply fixes."
#
# [fleet.profiles.pr-reviewer]
# slot = "reviewer"
# loadout = "inherit"
#
# [fleet.profiles.pr-reviewer.role]
# name = "PR Reviewer"
# description = "Reviews PRs with GitHub access"
# instructions = "Review diffs for correctness, regressions, and missing tests."

# ─────────────────────────────────────────────────────────────────────────────────
# Named fleets live in files, not inline tables (0.9.14).
#
# Inline [fleets.<name>] tables were removed: define named fleets as
# `fleets/<name>.toml` under $CODEWHALE_HOME or the workspace instead
# (see docs/FLEET.md). Old inline tables still parse but are ignored.
# ─────────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────────
# Requirements (admin constraints) example file
# ─────────────────────────────────────────────────────────────────────────────────
# allowed_approval_policies = ["on-request", "untrusted", "never"]
# allowed_sandbox_modes = ["read-only", "workspace-write"]
