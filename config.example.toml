# Codewhale API (https://app.codewhale.net/settings?section=api)
# Account-backed model access over the provider keys connected to the
# customer's Codewhale account. The account's authenticated `GET /v1/models`
# listing is the catalog authority: each `provider/model` row states its wire
# (`chat-completions` → `/v1/chat/completions`, `anthropic-messages` →
# `/v1/messages`, `responses` → `/v1/responses`). Every protocol authenticates
# the account key with `Authorization: Bearer`, never `x-api-key`.
# Provider aliases: codewhale-api, cw-api, codewhale-cloud
# Env vars: CODEWHALE_API_KEY, CODEWHALE_API_BASE (HTTPS except loopback);
#           the generic CODEWHALE_MODEL override also applies.
