# Codewhale feature registry: the one hand-edited list of user features.
#
# A new command, `[features]` flag, provider or user-visible feature lands
# with its row here in the same change. `crates/tui/tests/feature_registry.rs`
# checks this file against the code and fails on drift:
#
#   cargo test -p codewhale-tui --test feature_registry
#
# Fields
#   id        stable kebab-case id; never reused
#   name      display name
#   summary   one line, at most 120 characters
#   status    stable | experimental | flagged | planned
#               stable       shipped and on by default, no experimental label
#               experimental shipped, labelled experimental or preview
#               flagged      shipped but off until the user turns it on
#               planned      not built; no `since` or `flag`
#   surfaces  per-surface status: tui (the terminal binary and its CLI), web
#             (the local browser client), api (Runtime API `/v1/*`); values
#             are stable | preview | partial | none | planned. A missing key
#             means "not recorded yet", not "absent".
#   since     first release that shipped it ("unreleased" before a release).
#             Optional until backfilled; when set it must be a CHANGELOG
#             heading.
#   flag      a `[features]` key from `crates/runtime/src/features.rs`. Each key
#             is owned by exactly one row, and the row's status follows the
#             flag: off by default -> flagged; on and Stable -> stable; on and
#             Experimental/Beta -> experimental.
#   docs      user doc path (optional `#anchor`); must exist. Missing means
#             the feature has no user doc yet, which is itself a gap to close.
#   owner     code path that owns the behavior; must exist.
#
# Desktop (GPUI app) rows and surfaces are not recorded here yet: that
# repository is private, so its unreleased features stay out of this public
# file until that is decided.

