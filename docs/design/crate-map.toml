# codewhale-tui crate map (see docs/design/CRATE_MAP.md). runtime-wire is named app-server-protocol (founder, 2026-10-31).
# Layers are a strict order chosen to minimise upward refs; no two crates on one layer share an edge.
# Bands: runtime first, then hosts (thread host, runtime API, acp/mcp/exec hosts, relay, doctor), then TUI and commands, then cli (composition root).
# command-contract, telemetry and tui-kit name EXISTING workspace crates that absorb dependency-free units.
ceiling = 50000
target = 10000

# EXISTING crate: absorbs pure command and keybinding tables (506 lines)
[crates.command-contract]
layer = 1
units = ["command_catalog", "keybinding_table"]

# EXISTING crate: absorbs the telemetry notice (390 lines)
[crates.telemetry]
layer = 1
units = ["telemetry_notice"]

# MCP client pool and transports (13274 lines)
[crates.mcp-pool]
layer = 2
units = ["mcp/*"]

# live provider/model catalog and readiness (8320 lines)
[crates.model-catalog]
layer = 2
units = ["provider_lake", "provider_catalog_live", "models_dev_live", "codex_model_cache", "model_inventory", "provider_readiness", "model_profile", "model_relevance", "reasoning_preference", "route_receipt"]

# remote control protocol and pairing (leaf, no crate refs) (4934 lines)
[crates.remote-control]
layer = 2
