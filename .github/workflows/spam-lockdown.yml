name: Lock down obvious spam issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  lockdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Auto-close spam patterns from new accounts
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const author = issue.user;

            // Only consider brand-new accounts. If the user has been around
            // long enough to file good-faith issues elsewhere, don't touch.
            const created = new Date(author.created_at || 0);
            const ageDays = (Date.now() - created.getTime()) / 86_400_000;
            if (ageDays > 30) return;

            const blob = `${issue.title || ''}\n${issue.body || ''}`;
            const patterns = [
              /\btg\s*@/i,
              /\btelegram\s+@/i,
              /\bt\.me\//i,
              /\bwhatsapp\s+\+/i,
              /\bseo\s+service/i,
              /\bguest\s+post/i,
              /\bbacklink/i,
              /\bbuy\s+followers/i,
            ];
            const hit = patterns.find(p => p.test(blob));
            if (!hit) return;

            // Label and close; no comment (founder, 2026-09-22). The label
            // description tells a false positive how to get the issue back.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'spam',
                color: 'b60205',
                description: 'Auto-closed: spam pattern from a <30-day account. Real report? Reopen with project context',
              });
            } catch (error) {
              if (error.status !== 422) throw error; // 422: label already exists
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'not_planned',
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['spam'],
            });
