name: Release artifacts

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character source commit to build
        required: true
        type: string
      version:
        description: Workspace version without a v prefix
        required: true
        type: string
      compiled_host_delivery:
        description: Explicitly include qualified optional companions; Node stays default
        required: false
        default: false
        type: boolean
      compiled_host_run_id:
        description: Green official CI run at this exact SHA containing Native image proof
        required: false
        default: ''
        type: string
      compiled_host_targets:
        description: Comma-separated matching-native targets with qualified CI receipts
        required: false
        default: linux-x64,macos-arm64,windows-x64
        type: string
      retention_days:
        description: Retention for Actions-only intermediate and assembled artifacts
        required: false
        default: 7
        type: number
    secrets:
      CODEWHALE_RELEASE_SIGNING_KEY:
        description: Ed25519 release key (PEM). Absent means the release ships unsigned.
        required: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -Dwarnings
  # Build identity is the trusted workflow SHA. Callers pass source_sha only
  # so `pin` can refuse a mismatch; it must not retarget checkout or caches.
  CODEWHALE_BUILD_SHA: ${{ github.sha }}

jobs:
  pin:
    name: Pin caller SHA to this run
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Require source_sha equals github.sha
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${#SOURCE_SHA}" -ne 40 || "${SOURCE_SHA}" =~ [^0-9a-fA-F] ]]; then
            echo "::error::source_sha must be a full 40-character commit SHA." >&2
            exit 1
          fi
          expected="$(printf '%s' "${SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          actual="$(printf '%s' "${GITHUB_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Reusable workflow SHA ${actual} does not match source_sha ${SOURCE_SHA}." >&2
            exit 1
          fi
      - name: Require explicit matching-native qualification selection
        if: inputs.compiled_host_delivery
        env:
          QUALIFICATION_RUN: ${{ inputs.compiled_host_run_id }}
          HOST_TARGETS: ${{ inputs.compiled_host_targets }}
        run: |
          set -euo pipefail
          [[ "${QUALIFICATION_RUN}" =~ ^[0-9]+$ ]] || { echo 'Enabled host delivery needs an exact green CI run id' >&2; exit 1; }
          [[ -n "${HOST_TARGETS}" ]] || { echo 'No compiled host targets selected' >&2; exit 1; }
          declare -A seen
          IFS=',' read -ra selected <<< "${HOST_TARGETS}"
          for target in "${selected[@]}"; do
            case "${target}" in linux-x64|linux-arm64|macos-x64|macos-arm64|windows-x64|windows-arm64) ;; *) echo "Unsupported compiled host target ${target}" >&2; exit 1 ;; esac
            [[ -z "${seen[${target}]:-}" ]] || { echo "Duplicate compiled host target ${target}" >&2; exit 1; }
            seen["${target}"]=1
          done

  build:
    name: Build ${{ matrix.platform }}
    # Both cold macOS artifact builds on 0.10.1 exhausted 90 minutes inside
    # compilation. Keep the full CI build budget; packaging stays capped below.
    timeout-minutes: 210
    # FreeBSD is a source-build target with no prebuilt asset, no npm binary and no CI check
    # (see packaging/freebsd/README.md and docs/INSTALL.md#freebsd).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x64
            cli_binary: codewhale
            shim_binary: codew
            cli_artifact: codewhale-linux-x64
            shim_artifact: codew-linux-x64
            compat_tui_artifact: codewhale-tui-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
            cli_binary: codewhale
            shim_binary: codew
            cli_artifact: codewhale-linux-arm64
            shim_artifact: codew-linux-arm64
            compat_tui_artifact: codewhale-tui-linux-arm64
          - os: ubuntu-latest
            target: aarch64-linux-android
            platform: android-arm64
            cli_binary: codewhale
            shim_binary: codew
            cli_artifact: codewhale-android-arm64
            shim_artifact: codew-android-arm64
            compat_tui_artifact: codewhale-tui-android-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
            cli_binary: codewhale
            shim_binary: codew
            cli_artifact: codewhale-macos-x64
            shim_artifact: codew-macos-x64
            compat_tui_artifact: codewhale-tui-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            cli_binary: codewhale
            shim_binary: codew
            cli_artifact: codewhale-macos-arm64
            shim_artifact: codew-macos-arm64
            compat_tui_artifact: codewhale-tui-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            cli_binary: codewhale.exe
            shim_binary: codew.exe
            cli_artifact: codewhale-windows-x64.exe
            shim_artifact: codew-windows-x64.exe
            compat_tui_artifact: codewhale-tui-windows-x64.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            cli_binary: codewhale.exe
            shim_binary: codew.exe
            cli_artifact: codewhale-windows-arm64.exe
            shim_artifact: codew-windows-arm64.exe
            compat_tui_artifact: codewhale-tui-windows-arm64.exe
          # Native HarmonyOS and OpenHarmony. The artifact is useless unsigned:
          # the device refuses to execute an unsigned ELF (see
          # docs/HarmonyOS.md), so this leg self-signs the binary before staging.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-ohos
            platform: ohos-arm64
            cli_binary: codewhale
            shim_binary: codew
            cli_artifact: codewhale-ohos-arm64
            shim_artifact: codew-ohos-arm64
            compat_tui_artifact: codewhale-tui-ohos-arm64
    runs-on: ${{ matrix.os }}
    needs: pin
    steps:
      # No ref: — GITHUB_SHA only. CodeQL treats workflow_call checkout-with-ref
      # and any ref named *sha* as an untrusted checkout (cache-poisoning).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-07-18
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        id: sccache
        continue-on-error: true
      - name: Enable sccache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          } >> "${GITHUB_ENV}"
      # Restore after the trusted lockfile is on disk. Key is OS + arch +
      # explicit stable toolchain + rust-cache's Cargo.lock / rust-toolchain
      # hash. Never interpolate github.event, github.ref, github.sha, or inputs.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          prefix-key: v1-${{ runner.os }}-${{ runner.arch }}-stable
      - name: Build static Linux binaries (musl)
        if: endsWith(matrix.target, '-unknown-linux-musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils musl-tools
          rustup target add --toolchain stable ${{ matrix.target }}
          cargo build --profile dist --locked --target ${{ matrix.target }} -p codewhale-cli
      - name: Configure Android NDK linker
        if: matrix.target == 'aarch64-linux-android' && runner.os == 'Linux'
        shell: bash
        env:
          ANDROID_NDK_VERSION: 27.2.12479018
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          ndk="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          linker=""
          if [[ -n "${ndk}" ]]; then
            linker="${ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          fi
          if [[ -z "${linker}" || ! -x "${linker}" ]]; then
            if ! command -v sdkmanager >/dev/null 2>&1; then
              echo "sdkmanager is required to install Android NDK ${ANDROID_NDK_VERSION}" >&2
              exit 1
            fi
            android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            if [[ -z "${android_home}" ]]; then
              echo "ANDROID_HOME or ANDROID_SDK_ROOT is required to install Android NDK ${ANDROID_NDK_VERSION}" >&2
              exit 1
            fi
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
            ndk="${android_home}/ndk/${ANDROID_NDK_VERSION}"
            linker="${ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          fi
          ar="${ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          if [[ ! -x "${linker}" ]]; then
            echo "Android linker not found: ${linker}" >&2
            exit 1
          fi
          if [[ ! -x "${ar}" ]]; then
            echo "Android archiver not found: ${ar}" >&2
            exit 1
          fi
          {
            echo "ANDROID_NDK_ROOT=${ndk}"
            echo "ANDROID_NDK_HOME=${ndk}"
            echo "CC_aarch64_linux_android=${linker}"
            echo "AR_aarch64_linux_android=${ar}"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${linker}"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android24 --sysroot=${ndk}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          } >> "${GITHUB_ENV}"
      - name: Build
        if: ${{ !endsWith(matrix.target, '-unknown-linux-musl') && matrix.platform != 'ohos-arm64' }}
        shell: bash
        run: cargo build --profile dist --locked --target ${{ matrix.target }} -p codewhale-cli
      - name: Install OpenHarmony native SDK
        if: matrix.platform == 'ohos-arm64'
        id: ohos-sdk
        # Pin the action: it downloads a published OpenHarmony SDK and verifies
        # the archive checksum, so a broken mirror fails here instead of
        # producing a binary linked against host headers.
        uses: openharmony-rs/setup-ohos-sdk@b312caf8a43bb836aa24c08f65f97e1f09a89cad
        with:
          version: '6.1'
          # `toolchains` carries binary-sign-tool.jar, which signs the binary
          # below; a release without it would ship an ELF the device refuses to
          # execute.
          components: 'native;toolchains'
          # One download per release is cheaper than letting a tag save a 715 MB
          # cache entry that main's jobs then compete with.
          cache: false
          mirror: true
      - name: Install Java for the OpenHarmony binary signer
        if: matrix.platform == 'ohos-arm64'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cross-compile and code-sign the OpenHarmony binary
        if: matrix.platform == 'ohos-arm64'
        shell: bash
        env:
          OHOS_NATIVE_SDK: ${{ steps.ohos-sdk.outputs.ohos_sdk_native }}
        run: |
          set -euo pipefail
          test -x "${OHOS_NATIVE_SDK}/llvm/bin/clang"
          test -d "${OHOS_NATIVE_SDK}/sysroot"
          # ohos-env.sh also puts the SDK's cmake on PATH, which aws-lc-sys
          # needs; without it the build dies inside its CMake probe.
          . ./scripts/ohos-env.sh
          cargo build --profile dist --locked --target "${{ matrix.target }}" -p codewhale-cli

          bin="target/${{ matrix.target }}/dist/${{ matrix.cli_binary }}"
          signer="$(dirname "${OHOS_NATIVE_SDK}")/toolchains/lib/binary-sign-tool.jar"
          if [[ ! -f "${signer}" ]]; then
            echo "binary-sign-tool.jar is missing from the SDK toolchains component" >&2
            exit 1
          fi
          java -jar "${signer}" sign -inFile "${bin}" -outFile "${bin}" -selfSign 1

          # Capture then match. `tool | grep -q` cannot be used under
          # `pipefail`: grep exits at the first match, the tool takes SIGPIPE,
          # and llvm-readelf reports that as exit 74, which reads as a failed
          # verification of a good binary.
          signature="$(java -jar "${signer}" display-sign -inFile "${bin}")"
          case "${signature}" in
            *'code signature is self-sign'*) ;;
            *)
              echo 'the staged binary is not self-signed; the device would refuse to execute it' >&2
              exit 1
              ;;
          esac

          kind="$(file -b "${bin}")"
          case "${kind}" in
            *'ARM aarch64'*) ;;
            *)
              echo "not an aarch64 ELF: ${kind}" >&2
              exit 1
              ;;
          esac

          headers="$("${OHOS_NATIVE_SDK}/llvm/bin/llvm-readelf" -l "${bin}")"
          case "${headers}" in
            *'/lib/ld-musl-aarch64.so.1'*) ;;
            *)
              echo "unexpected ELF interpreter for ${bin}" >&2
              exit 1
              ;;
          esac
      - name: Materialize codew command alias
        shell: bash
        run: |
          bin_dir="target/${{ matrix.target }}/dist"
          cp "${bin_dir}/${{ matrix.cli_binary }}" "${bin_dir}/${{ matrix.shim_binary }}"
          cmp "${bin_dir}/${{ matrix.cli_binary }}" "${bin_dir}/${{ matrix.shim_binary }}"
      - name: Verify static Linux binaries and launch on matching native runners
        if: >-
          endsWith(matrix.target, '-unknown-linux-musl') &&
          ((startsWith(matrix.target, 'x86_64-') && runner.arch == 'X64') ||
          (startsWith(matrix.target, 'aarch64-') && runner.arch == 'ARM64'))
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/dist"
          for binary in "${{ matrix.cli_binary }}" "${{ matrix.shim_binary }}"; do
            bin_path="${bin_dir}/${binary}"
            if readelf -l "${bin_path}" | grep -Fq 'INTERP'; then
              echo "Expected a static musl binary, but ${bin_path} has an ELF interpreter" >&2
              exit 1
            fi
            "${bin_path}" --version
          done
      - name: Smoke binaries on matching native runners
        if: >-
          matrix.target != 'aarch64-linux-android' &&
          ((startsWith(matrix.target, 'x86_64-') && runner.arch == 'X64') ||
          (startsWith(matrix.target, 'aarch64-') && runner.arch == 'ARM64'))
        shell: bash
        run: |
          bin_dir="target/${{ matrix.target }}/dist"
          "${bin_dir}/${{ matrix.cli_binary }}" --version
          "${bin_dir}/${{ matrix.shim_binary }}" --version
      - name: Windows Terminal clipboard acceptance
        if: matrix.platform == 'windows-x64'
        timeout-minutes: 5
        shell: pwsh
        run: node scripts/release/windows-terminal-clipboard.mjs "target/${{ matrix.target }}/dist/codewhale.exe" "${{ runner.temp }}/windows-clipboard"
      - name: Retain Windows Terminal clipboard evidence
        if: ${{ !cancelled() && matrix.platform == 'windows-x64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows-clipboard-${{ github.sha }}
          path: ${{ runner.temp }}/windows-clipboard/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
      - name: Stage binaries
        shell: bash
        run: |
          stage_binary() {
            local binary="$1"
            local artifact="$2"
            local bin_path="target/${{ matrix.target }}/dist/${binary}"
            if [[ ! -f "${bin_path}" ]]; then
              echo "Binary not at ${bin_path}; searching target/ for ${binary}:" >&2
              find target -name "${binary}" -type f
              exit 1
            fi
            cp "${bin_path}" "${artifact}"
          }

          stage_binary "${{ matrix.cli_binary }}" "${{ matrix.cli_artifact }}"
          stage_binary "${{ matrix.shim_binary }}" "${{ matrix.shim_artifact }}"
          # Compatibility bridge for v0.9.4's hard-coded release
          # completeness/updater contract. This is the same runtime, not a
          # separately compiled or installed TUI command.
          stage_binary "${{ matrix.cli_binary }}" "${{ matrix.compat_tui_artifact }}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2
        if: inputs.compiled_host_delivery && contains(format(',{0},', inputs.compiled_host_targets), format(',{0},', matrix.platform))
        with:
          bun-version: 1.4.0
      - name: Stage exact qualified optional host image
        if: inputs.compiled_host_delivery && contains(format(',{0},', inputs.compiled_host_targets), format(',{0},', matrix.platform))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ inputs.compiled_host_run_id }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ inputs.version }}
          RUNTIME_CLOSURE_DIR: ${{ vars.CODEWHALE_COMPILED_HOST_CLOSURE_DIR }}
        run: |
          set -euo pipefail
          proof_dir="${RUNNER_TEMP}/compiled-host-proof-${TARGET_PLATFORM}"
          node scripts/release/fetch-compiled-host-proof.js --repo "${GITHUB_REPOSITORY}" --run-id "${QUALIFICATION_RUN}" --source-sha "${GITHUB_SHA}" --target "${TARGET_PLATFORM}" --output "${proof_dir}"
          test -n "${RUNTIME_CLOSURE_DIR}" || { echo 'Enabled compiled-host delivery requires reviewed complete local runtime notices/relink-source closure' >&2; exit 1; }
          bun_binary="$(bun -p 'process.execPath')"
          extension=""
          if [[ "${TARGET_PLATFORM}" == windows-* ]]; then extension=.exe; fi
          node scripts/release/stage-compiled-host.mjs --bun "${bun_binary}" --compiled-image "${proof_dir}/codewhale-extension-host${extension}" --native-receipt "${proof_dir}/native-receipt.json" --runtime-closure "${RUNTIME_CLOSURE_DIR}/${TARGET_PLATFORM}.json" --target "${TARGET_PLATFORM}" --version "${RELEASE_VERSION}" --source-sha "${GITHUB_SHA}" --output-dir "compiled-host-${TARGET_PLATFORM}"
      - name: Check every staged Windows executable import
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binaries = @('${{ matrix.cli_artifact }}', '${{ matrix.shim_artifact }}', '${{ matrix.compat_tui_artifact }}')
          $hostDirectory = 'compiled-host-${{ matrix.platform }}'
          if (Test-Path $hostDirectory) {
            $binaries += @(Get-ChildItem -Path $hostDirectory -Filter *.exe -Recurse -File | ForEach-Object { $_.FullName })
          }
          python scripts/release/check-windows-imports.py --expected-machine '${{ matrix.platform }}' --output '${{ runner.temp }}/windows-imports-${{ matrix.platform }}' @binaries
          if ($LASTEXITCODE -ne 0) { throw 'Windows static import qualification failed' }
      - name: Retain Windows import receipts
        if: always() && startsWith(matrix.platform, 'windows-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-imports-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/windows-imports-${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.compiled_host_delivery && contains(format(',{0},', inputs.compiled_host_targets), format(',{0},', matrix.platform))
        with:
          name: codewhale-compiled-host-${{ matrix.platform }}
          path: |
            compiled-host-${{ matrix.platform }}/codewhale-extension-host-*
            compiled-host-${{ matrix.platform }}/codewhale-extension-hosts.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.cli_artifact }}
          path: ${{ matrix.cli_artifact }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.shim_artifact }}
          path: ${{ matrix.shim_artifact }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.compat_tui_artifact }}
          path: ${{ matrix.compat_tui_artifact }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          overwrite: true

  bundle:
    timeout-minutes: 15
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          pattern: '*'
      - name: Collect only qualified requested compiled hosts
        if: inputs.compiled_host_delivery
        shell: bash
        run: node scripts/release/stage-compiled-host.mjs --collect artifacts --output-dir artifacts/codewhale-compiled-hosts
      - name: Create and checksum platform archives
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "${SOURCE_SHA}")"
          if [[ ! "${source_date_epoch}" =~ ^[0-9]+$ ]]; then
            echo "Could not read a Unix timestamp for source commit ${SOURCE_SHA}" >&2
            exit 1
          fi
          SOURCE_DATE_EPOCH="${source_date_epoch}" \
            bash scripts/release/create-release-bundles.sh artifacts bundles
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codewhale-bundles
          path: |
            bundles/*.tar.gz
            bundles/*.zip
            bundles/codewhale-bundles-sha256.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.compiled_host_delivery
        with:
          name: codewhale-compiled-hosts
          path: artifacts/codewhale-compiled-hosts/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          overwrite: true

  windows-installer:
    timeout-minutes: 15
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          pattern: '*windows-x64*'
      - name: Install NSIS
        shell: pwsh
        run: ./scripts/installer/install-nsis.ps1
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item "artifacts\codewhale-windows-x64.exe\codewhale-windows-x64.exe" "scripts\installer\codewhale.exe"
          Copy-Item "artifacts\codew-windows-x64.exe\codew-windows-x64.exe" "scripts\installer\codew.exe"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) {
            $makensis = "${env:ProgramFiles}\NSIS\makensis.exe"
          }
          if (!(Test-Path $makensis)) {
            throw "makensis.exe not found after NSIS install"
          }
          $hostDefine = @()
          $hostCatalog = "artifacts\codewhale-compiled-host-windows-x64\codewhale-extension-hosts.json"
          if (Test-Path $hostCatalog) {
            node -e "const h=require('./npm/codewhale/scripts/compiled-hosts'); const fs=require('fs'); const p=require('path'); const f=process.argv[1]; h.verifyDirectory(p.dirname(f), h.parseCatalog(fs.readFileSync(f),'${{ inputs.version }}'));" $hostCatalog
            if ($LASTEXITCODE -ne 0) { throw 'Compiled host payload/catalog verification failed' }
            $catalog = Get-Content -Raw $hostCatalog | ConvertFrom-Json
            $hostEntry = @($catalog.hosts | Where-Object { $_.target -eq 'windows-x64' })
            if ($hostEntry.Count -ne 1) { throw 'No unique qualified Windows host' }
            $hostDir = Split-Path $hostCatalog
            Copy-Item "$hostDir\$($hostEntry[0].asset)" "scripts\installer\codewhale-extension-host.exe"
            Copy-Item "$hostDir\$($hostEntry[0].notices_asset)" "scripts\installer\codewhale-extension-host.LICENSES.txt"
            Copy-Item "$hostDir\$($hostEntry[0].source_asset)" "scripts\installer\codewhale-extension-host.relink-source.tar.gz"
            Copy-Item $hostCatalog "scripts\installer\codewhale-extension-host.release.json"
            $hostDefine = @('/DCOMPILED_HOST=1')
          }
          Push-Location scripts\installer
          & $makensis "/DVERSION=${{ inputs.version }}" @hostDefine "codewhale.nsi"
          Pop-Location
          if (!(Test-Path "scripts\installer\CodeWhaleSetup.exe")) {
            throw "CodeWhaleSetup.exe was not produced"
          }
      - name: Check Windows installer and embedded executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDirectory = '${{ runner.temp }}/windows-installer-imports'
          $embeddedDirectory = Join-Path $evidenceDirectory 'embedded'
          New-Item -Path $evidenceDirectory -ItemType Directory -Force | Out-Null
          & 7z l 'scripts/installer/CodeWhaleSetup.exe' | Out-File (Join-Path $evidenceDirectory 'archive-listing.txt') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'NSIS embedded payload inventory failed' }
          & 7z x 'scripts/installer/CodeWhaleSetup.exe' "-o$embeddedDirectory" '$PLUGINSDIR/*.dll' | Out-File (Join-Path $evidenceDirectory 'archive-extraction.txt') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'NSIS embedded plugin extraction failed' }
          $plugins = @(Get-ChildItem -Path $embeddedDirectory -Filter *.dll -Recurse -File)
          if ($plugins.Name -notcontains 'System.dll' -or $plugins.Name -notcontains 'nsDialogs.dll') { throw 'Expected MUI2 System and nsDialogs plugin payloads' }
          $binaries = @(Get-ChildItem -Path scripts/installer -Filter *.exe -File | ForEach-Object { $_.FullName })
          if ($binaries.Count -lt 3) { throw 'Expected installer, CLI and shim executables' }
          $binaries += @($plugins | ForEach-Object { $_.FullName })
          python scripts/release/check-windows-imports.py --output $evidenceDirectory @binaries
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer static import qualification failed' }
      - name: Retain Windows installer import receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installer-imports-${{ github.sha }}
          path: ${{ runner.temp }}/windows-installer-imports/
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CodeWhaleSetup.exe
          path: scripts/installer/CodeWhaleSetup.exe
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          overwrite: true

  assemble:
    timeout-minutes: 15
    needs: [bundle, windows-installer]
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs.windows-installer.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: intermediate-artifacts
          pattern: '*'
      - name: Assemble exact authoritative release inventory
        run: node scripts/release/assemble-release-assets.js intermediate-artifacts release-assets
      - name: Sign the checksum manifest when the release key is configured
        env:
          CODEWHALE_RELEASE_SIGNING_KEY: ${{ secrets.CODEWHALE_RELEASE_SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${CODEWHALE_RELEASE_SIGNING_KEY}" ]]; then
            echo "CODEWHALE_RELEASE_SIGNING_KEY is not configured; this release is unsigned and automatic updates wait for each user's OK."
            exit 0
          fi
          bash scripts/release/sign-release-manifest.sh "${VERSION}" \
            release-assets/codewhale-artifacts-sha256.txt \
            release-assets/codewhale-artifacts-sha256.txt.sig
          node scripts/release/assemble-release-assets.js --verify release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codewhale-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0
          overwrite: true

  smoke:
    timeout-minutes: 15
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codewhale-release-assets
          path: release-assets
      - name: Verify 34-asset bridge inventory and checksum manifests (single binary)
        run: node scripts/release/assemble-release-assets.js --verify release-assets
      - name: Test release inventory contracts
        run: |
          node --test scripts/release/assemble-release-assets.test.js
          node --test npm/codewhale/test/artifacts.test.js npm/codewhale/test/release-assets.test.js
      - name: Render AUR metadata from candidate Linux archives
        run: bash packaging/aur/render.sh release-assets "${RUNNER_TEMP}/codewhale-bin"
      - name: Smoke packed npm wrapper against candidate assets
        env:
          CODEWHALE_SMOKE_ASSETS_DIR: ${{ github.workspace }}/release-assets
        run: node scripts/release/npm-wrapper-smoke.js
      - name: Record non-public candidate identity
        shell: bash
        run: |
          {
            echo "### Release artifact candidate"
            echo ""
            echo "- Source: \`${{ github.sha }}\`"
            echo "- Version metadata: \`${{ inputs.version }}\`"
            echo "- Inventory: 7 targets / 34 files (single binary; 7 legacy alias assets)"
            echo "- Publication: none (Actions artifact \`codewhale-release-assets\` only)"
          } >> "${GITHUB_STEP_SUMMARY}"
