name: Windows focus

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit selected by --ref
        required: true
        type: string
      filter:
        description: nextest expression, for example 'test(compaction_lock) | test(persistence_actor)'
        required: true
        default: all()
        type: string

permissions:
  contents: read

jobs:
  focused:
    name: Focused tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -Dwarnings
      RUST_MIN_STACK: 8388608
      RUST_BACKTRACE: full
      FILTER: ${{ inputs.filter }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Verify exact commit SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ "${#EXPECTED_SHA}" -ne 40 || "${EXPECTED_SHA}" =~ [^0-9a-fA-F] ]]; then
            echo "::error::expected_sha must be a full 40-character commit SHA." >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          expected_normalized="$(printf '%s' "${EXPECTED_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${actual}" != "${expected_normalized}" ]]; then
            echo "::error::Dispatch resolved to ${actual}, not requested ${EXPECTED_SHA}." >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: taiki-e/install-action@b6620ca104fb7b50dafa1109be9622abc1fdd381
        with:
          tool: cargo-nextest@0.9.151
      - name: Run focused tests
        shell: bash
        run: cargo nextest run -p codewhale-engine -p codewhale-plugins -p codewhale-tui -p codewhale-app-server --lib --locked --profile ci -E "$FILTER"
