name: Catalog refresh

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the model catalog
    if: github.repository == 'codewhale-hq/Codewhale'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BRANCH: catalog-refresh
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app-token
        with:
          app-id: ${{ vars.CODEWHALE_APP_ID }}
          private-key: ${{ secrets.CODEWHALE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Fetch models.dev once
        run: |
          curl --fail --silent --show-error --location --max-time 60 \
            --user-agent "CodeWhale-catalog-automation (+https://github.com/codewhale-hq/Codewhale)" \
            --output "$RUNNER_TEMP/models-dev-catalog.json" \
            https://models.dev/catalog.json
      - name: Decide whether the pin is due
        id: pin
        run: |
          if python3 scripts/catalog_models_dev.py seed age --max-days 7; then
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Propose new models, re-lock and render
        env:
          CODEWHALE_MODELS_DEV_PATH: ${{ runner.temp }}/models-dev-catalog.json
        run: |
          python3 scripts/catalog_models_dev.py seed discover --write --snapshot "$CODEWHALE_MODELS_DEV_PATH" | tee "$RUNNER_TEMP/discover.txt"
          python3 scripts/catalog_models_dev.py seed lock > "$RUNNER_TEMP/lock-report.txt"
          python3 scripts/catalog_models_dev.py seed render
          (cd web && node scripts/derive-facts.mjs)
      - name: Decide whether anything material changed
        id: change
        run: |
          material=$(git diff -U0 -- \
            crates/config/assets/models_dev.bundled.json \
            crates/config/assets/catalog_corrections.json \
            scripts/catalog/models_dev_seed.toml \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v '"upstream":' || true)
          if [ -n "$material" ] || [ "${{ steps.pin.outputs.due }}" = "true" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "No catalog change and the pin is under 7 days old; nothing to propose."
          fi
      - name: Run the catalog checks
        id: checks
        if: steps.change.outputs.open == 'true'
        run: |
          set +e
          {
            python3 scripts/catalog_models_dev.py seed render --check
            python3 scripts/catalog_models_dev.py seed age --max-days 30
            python3 -m unittest scripts/catalog_models_dev_test.py
            (cd web && node scripts/check-facts.mjs)
          } > "$RUNNER_TEMP/checks.txt" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          tail -n 40 "$RUNNER_TEMP/checks.txt"
      - name: Push the branch and open or update the pull request
        if: steps.change.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECKS_OK: ${{ steps.checks.outputs.ok }}
          APP_ID: ${{ vars.CODEWHALE_APP_ID }}
        run: |
          git config user.name 'codewhale-agent[bot]'
          git config user.email "${APP_ID}+codewhale-agent[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add crates/config/assets/models_dev.bundled.json crates/config/assets/catalog_corrections.json \
            scripts/catalog/models_dev_seed.toml scripts/catalog/models_dev_seed.lock.json web/lib/facts.generated.ts
          git commit -m "chore(catalog): refresh the Models.dev offline seed" \
            -m "Generated by .github/workflows/catalog-refresh.yml from models.dev. No LLM wrote these rows."
          git push --force-with-lease="$BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          {
            echo "Generated by the scheduled catalog refresh from models.dev. No LLM wrote these rows; review them like any other change."
            echo
            echo "New models from the vendor allowlist. Merging this PR publishes them on the public /models page; rows carry an \`unreviewed\` source until someone checks them against the vendor's docs:"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/discover.txt"
            echo '```'
            echo
            echo "Checks run in the job: \`seed render --check\`, \`seed age --max-days 30\`, \`scripts/catalog_models_dev_test.py\`, \`web/scripts/check-facts.mjs\`: $([ "$CHECKS_OK" = true ] && echo passed || echo FAILED, see the job log; this PR is a draft)."
            echo
            echo "To stop proposing a model, add its id to \`[discover].skip\` in \`scripts/catalog/models_dev_seed.toml\`."
          } > "$RUNNER_TEMP/pr-body.md"
          title="chore(catalog): refresh the Models.dev offline seed"
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
            if [ "$CHECKS_OK" = true ]; then
              gh pr ready "$existing"
            else
              gh pr ready --undo "$existing"
            fi
          else
            draft=""
            [ "$CHECKS_OK" = true ] || draft="--draft"
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md" $draft
          fi
