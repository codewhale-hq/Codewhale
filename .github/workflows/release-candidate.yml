name: Release candidate

# Safe pre-publication artifact proof. This workflow never creates a tag or
# release and never writes to a registry, container repository, tap, or deploy.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit selected by --ref (must match the dispatch SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact candidate source
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable 2026-07-18
        with:
          toolchain: stable
      - name: Match dispatch to the requested commit
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ "${#EXPECTED_SHA}" -ne 40 || "${EXPECTED_SHA}" =~ [^0-9a-fA-F] ]]; then
            echo "::error::expected_sha must be a full 40-character commit SHA." >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          expected_normalized="$(printf '%s' "${EXPECTED_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${actual}" != "${expected_normalized}" ]]; then
            echo "::error::Dispatch resolved to ${actual}, not requested ${EXPECTED_SHA}." >&2
            exit 1
          fi

          workspace_version="$(grep -E '^version = "' Cargo.toml | head -n1 | sed -E 's/^version = "([^"]+)".*/\1/')"
          npm_version="$(node -p "require('./npm/codewhale/package.json').version")"
          binary_version="$(node -p "require('./npm/codewhale/package.json').codewhaleBinaryVersion")"
          if [[ "${workspace_version}" != "${npm_version}" ]]; then
            echo "::error::Candidate version drift: workspace=${workspace_version}, npm=${npm_version}, binary=${binary_version}." >&2
            exit 1
          fi
          if [[ "${workspace_version}" != "${binary_version}" ]]; then
            echo "::error::Candidate version drift: workspace=${workspace_version}, npm=${npm_version}, binary=${binary_version}." >&2
            exit 1
          fi

          echo "sha=${actual}" >> "${GITHUB_OUTPUT}"
          echo "version=${workspace_version}" >> "${GITHUB_OUTPUT}"
      - name: Check version and OHOS release contracts
        # --require-dated-release, as auto-tag.yml and release.yml run it:
        # release.yml only accepts an RC receipt for the exact tag SHA, so an
        # RC on an undated "Unreleased candidate" changelog could never
        # authorize a release. Fail here, before the long parity and artifact
        # builds, instead of at tag time.
        run: |
          ./scripts/release/check-versions.sh --require-dated-release
          ./scripts/release/check-ohos-deps.sh
      - name: Reconfirm clean source snapshot
        run: git diff --exit-code

  web:
    name: Verify exact candidate web surface
    timeout-minutes: 15
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # resolve already proved expected_sha equals GITHUB_SHA. Do not
      # interpolate that SHA into checkout or the npm cache key.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # `check:facts` derives each model's `addedAt` from the commit date
          # on which its id first appeared in the model declaration paths
          # (web/scripts/facts-lib.mjs). A shallow checkout collapses every
          # date to the tip commit and the committed facts always read as
          # stale; web.yml and ci.yml pin depth 0 for the same reason.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Run web tests
        run: npm test
      - name: Check exact candidate web surface
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check

  parity:
    # The same gate release.yml runs before publish. release.yml refuses a tag
    # unless an RC run for that exact SHA has this job green
    # (scripts/release/require-rc-receipt.sh matches the "Parity" name).
    name: Parity
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    uses: ./.github/workflows/release-parity.yml

  artifacts:
    permissions:
      contents: read
      actions: read
    needs: [resolve, web]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.web.result == 'success' }}
    uses: ./.github/workflows/release-artifacts.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.version }}
      compiled_host_delivery: ${{ vars.CODEWHALE_COMPILED_HOST_DELIVERY == '1' }}
      compiled_host_run_id: ${{ vars.CODEWHALE_COMPILED_HOST_QUALIFICATION_RUN_ID || '' }}
      compiled_host_targets: ${{ vars.CODEWHALE_COMPILED_HOST_TARGETS || 'linux-x64,macos-arm64,windows-x64' }}
      retention_days: 7
