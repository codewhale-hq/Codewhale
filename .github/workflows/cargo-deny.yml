name: cargo-deny

permissions: {}

on:
  workflow_dispatch: {}
  workflow_call: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # Prevent sudden announcement of a new advisory from failing CI
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins `channel = "1.100.0"` with no target, so
      # inside the action's alpine (musl) container rustup resolves it to
      # `1.100.0-x86_64-unknown-linux-musl`, which the container does not
      # have. Without provisioning, the action's `rustup show` step prints
      # "error: override toolchain '1.100.0-x86_64-unknown-linux-musl' is not
      # installed" and then auto-installs mid-run (network-dependent ~12s
      # detour, hard failure if the download stalls). `rust-version` makes the
      # entrypoint run `rustup default 1.100.0` (same musl host triple) before
      # cargo-deny touches the workspace, so the toolchain file resolves to an
      # already-installed toolchain on every run.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          rust-version: 1.100.0
