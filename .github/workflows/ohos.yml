name: OpenHarmony

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ohos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -Dwarnings

jobs:
  cargo-check:
    name: cargo check (aarch64-unknown-linux-ohos)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-unknown-linux-ohos
      - name: Install OpenHarmony native SDK
        id: ohos-sdk
        # Pin the action: it downloads a published OpenHarmony SDK and verifies
        # the archive checksum. This job must never substitute host headers or
        # a stub sysroot and report that as target support.
        uses: openharmony-rs/setup-ohos-sdk@b312caf8a43bb836aa24c08f65f97e1f09a89cad
        with:
          version: '6.1'
          components: native
          # Save the ~715 MB SDK cache from main only. The action has no
          # restore-only mode, and with `cache: true` every PR ref that missed
          # main's entry saved its own 715 MB copy; a handful of open PRs
          # pushed the repo past the 10 GiB Actions cache cap and evicted the
          # Rust caches CI actually depends on. PRs download the SDK instead
          # (checksum-verified from the GitHub mirror below).
          cache: ${{ github.ref == 'refs/heads/main' }}
          mirror: true
      - name: Check Codewhale TUI and CLI with the real SDK/sysroot
        shell: bash
        env:
          OHOS_NATIVE_SDK: ${{ steps.ohos-sdk.outputs.ohos_sdk_native }}
        run: |
          set -euo pipefail
          test -x "${OHOS_NATIVE_SDK}/llvm/bin/clang"
          test -d "${OHOS_NATIVE_SDK}/sysroot"
          . ./scripts/ohos-env.sh
          cargo check --target aarch64-unknown-linux-ohos -p codewhale-tui -p codewhale-cli --locked
