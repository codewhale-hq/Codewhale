name: Qualify exact-source packages and macOS binary
on:
  push:
    branches: [ci/cw-0103-postfreeze-package-proof]
    paths: [.github/workflows/qualification-source-packages.yml]
permissions:
  contents: read
env:
  ENGINE_SOURCE: 6c211938e696c9084e709e5546bc6fb3406d27a3
  CARGO_INCREMENTAL: '0'
jobs:
  candidate-crates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.ENGINE_SOURCE }}
          persist-credentials: false
      - run: bash scripts/ci-apt-install.sh libdbus-1-dev pkg-config
      - name: Verify Cargo archives and record their notice hashes
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENGINE_SOURCE"
          export CARGO_HOME="$RUNNER_TEMP/cargo" CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR" "$RUNNER_TEMP/results"
          bash scripts/release/publish-crates.sh dry-run 2>&1 | tee "$RUNNER_TEMP/results/crate-verification.log"
          python3 - <<'PY'
          import hashlib,json,os,tarfile,subprocess
          from pathlib import Path
          result=Path(os.environ['RUNNER_TEMP'])/'results'
          names=['LICENSE','THIRD_PARTY_NOTICES.md','docs/THIRD_PARTY_NOTICES.md']
          documents={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names}
          rows=[]
          metadata=json.loads(subprocess.check_output(['cargo','metadata','--locked','--no-deps','--format-version','1']))
          package=Path(metadata.get('build_directory') or metadata['target_directory'])/'package'
          archives={p.name:p for p in package.glob('*.crate')}
          archives.update({p.name:p for p in (package/'tmp-registry').glob('*.crate')})
          for archive in sorted(archives.values()):
              with tarfile.open(archive) as tar:
                  vcs=json.load(tar.extractfile(archive.stem+'/.cargo_vcs_info.json'))
                  assert vcs['git']['sha1']==os.environ['ENGINE_SOURCE']
                  assert all(hashlib.sha256(tar.extractfile(archive.stem+'/codewhale-notices/'+n).read()).hexdigest()==digest for n,digest in documents.items())
              rows.append({'name':archive.name,'bytes':archive.stat().st_size,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest()})
          assert len(rows)==46, (str(package), list(archives))
          assert max(row['bytes'] for row in rows)<10*1024**2
          (result/'archive-inventory.json').write_text(json.dumps({'source':os.environ['ENGINE_SOURCE'],'canonicalNotices':documents,'archives':rows},indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: qualified-crate-inventory
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
