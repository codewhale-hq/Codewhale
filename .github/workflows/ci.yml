name: Native OpenCode ACP qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and extract exact release and external agent binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch-native-acp-inputs.py
      - name: Exercise the native Linux runtime in a loopback namespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net sh -c 'ip link set lo up && exec runuser -u "$1" -- "$2" "$3" --engine "$4/codewhale" --agent "$4/opencode" --out "$5" --sha 555322f9cbbd2c2fa197abe3263dc43f9e6f2532' sh "$(id -un)" "$(command -v python)" "$PWD/scripts/qualify-native-opencode.py" "$RUNNER_TEMP/native-acp-bin" "$RUNNER_TEMP/native-acp-work"
      - name: Exercise the native Windows runtime with outbound filtering
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP native-acp-bin
          $paths = @("$bin/codewhale.exe", "$bin/opencode.exe", (Get-Command python).Source)
          foreach ($exe in $paths) {
            New-NetFirewallRule -DisplayName "Native ACP qualification $exe" -Direction Outbound -Action Block -Program ([IO.Path]::GetFullPath($exe)) -RemoteAddress @('0.0.0.1-126.255.255.255','128.0.0.0-255.255.255.254','::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:fffe') -ErrorAction Stop | Out-Null
          }
          python scripts/qualify-native-opencode.py --engine "$bin/codewhale.exe" --agent "$bin/opencode.exe" --out "$env:RUNNER_TEMP/native-acp-work" --sha 555322f9cbbd2c2fa197abe3263dc43f9e6f2532
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-acp-${{ runner.os }}
          path: ${{ runner.temp }}/native-acp-work/receipt.json
          if-no-files-found: warn
