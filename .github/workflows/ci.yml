name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension-host-runtimes:
    name: Extension host runtimes (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/engine/extension-host
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: cbc255813db1412015ef1ab735f1c1dce5f1beaf
      - name: Verify source under test
        working-directory: .
        shell: bash
        run: test "$(git rev-parse HEAD)" = "cbc255813db1412015ef1ab735f1c1dce5f1beaf"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2
        with:
          bun-version: 1.4.0
      - run: npm ci
      - run: npm run typecheck && npm run build
      - name: Required Node and Bun source-host receipts
        run: npm test && npm run test:bun
      - name: Compile the same entry with the installed runtime and test it
        run: |
          bun_binary="$(bun -p 'process.execPath')"
          host_binary="$(node -p "require('path').join(process.env.RUNNER_TEMP, 'codewhale-extension-host' + (process.platform === 'win32' ? '.exe' : ''))")"
          node compile-host.mjs --bun "$bun_binary" --output "$host_binary"
          CODEWHALE_COMPILED_HOST_TEST_BINARY="$host_binary" CODEWHALE_BUN_TEST_BINARY="$bun_binary" node --test test/compiled-host.test.mjs
      - name: Keep runtime receipts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-host-runtime-${{ matrix.os }}
          path: crates/engine/extension-host/dist/builtin-modules.json
          if-no-files-found: error
