name: Temporary Vibe ACP qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and extract exact release and external agent binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch-native-vibe-inputs.py
      - name: Exercise the native Linux runtime in a loopback namespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net sh -c 'ip link set lo up && exec runuser -u "$1" -- "$2" "$3" "$5" "$4/codewhale"' sh "$(id -un)" "$(command -v python)" "$PWD/scripts/qualify-native-vibe.py" "$RUNNER_TEMP/native-acp-bin" "$RUNNER_TEMP/native-acp-work"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: temporary-vibe-${{ runner.os }}
          path: ${{ runner.temp }}/native-acp-work/receipt.json
          if-no-files-found: warn
