name: CI
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  golden:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: c20287c9e1db0694b6ef9f4f4f2e75bda09e9257
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 14700965016
          run-id: 44885310826
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-archive
      - name: Reproduce model resolution from the contributor test binary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, subprocess, tarfile, shutil
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          archive, = (tmp / "source-archive").rglob("nextest-archive.tar.zst")
          binary = tmp / "runtime-golden-test"
          with subprocess.Popen(["zstd", "-dq", "-c", archive], stdout=subprocess.PIPE) as proc:
              with tarfile.open(fileobj=proc.stdout, mode="r|") as tar:
                  for member in tar:
                      if member.isfile() and re.fullmatch(r"codewhale_runtime-[0-9a-f]+", pathlib.PurePosixPath(member.name).name):
                          with binary.open("wb") as out:
                              shutil.copyfileobj(tar.extractfile(member), out)
                          break
                  else:
                      raise RuntimeError("runtime test binary missing")
              proc.stdout.close()
          binary.chmod(0o700)
          test = "config::model_resolution_golden::model_resolution_matches_the_committed_golden"
          assert test in subprocess.check_output([binary, "--list"], text=True)
          subprocess.run([binary, "--exact", test], env={**os.environ, "WRITE_GOLDEN":"1"}, check=True)
          subprocess.run([binary, "--exact", test], check=True)
          PY
          git diff --check
          git diff --numstat -- crates/runtime/src/config/model_resolution.golden.tsv
          git diff --exit-code -- . ':!crates/runtime/src/config/model_resolution.golden.tsv'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: llmtr-golden
          path: crates/runtime/src/config/model_resolution.golden.tsv
          if-no-files-found: error
