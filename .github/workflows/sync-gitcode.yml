name: Sync to GitCode

on:
  push:
    branches: [main, 'ci/release-prep-*']
  release:
    types: [published]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    secrets:
      GITCODE_TOKEN:
        required: true

concurrency:
  group: gitcode-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.repository_owner == 'codewhale-hq' &&
      !(github.event_name == 'release' && github.event.release.prerelease) &&
      (!contains(fromJSON('["push","schedule","release"]'), github.event_name) || vars.GITCODE_MIRROR == 'enabled')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Push to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_USER: ${{ vars.GITCODE_USERNAME || 'HunterBown' }}
          GITCODE_REPO: ${{ vars.GITCODE_REPOSITORY || 'HunterBown/Codewhale' }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GITCODE_TOKEN:-}" ]; then
            echo "::error::GITCODE_TOKEN secret is not set; cannot push to GitCode." >&2
            exit 1
          fi

          ENCODED_USER="$(printf '%s' "${GITCODE_USER}" | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=""))')"
          ENCODED_TOKEN="$(printf '%s' "${GITCODE_TOKEN}" | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=""))')"
          git remote add gitcode "https://${ENCODED_USER}:${ENCODED_TOKEN}@gitcode.com/${GITCODE_REPO}.git"

          if [[ -n "${RELEASE_TAG}" ]]; then
            if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
                [[ "$(git rev-parse 'HEAD^{commit}')" != "${SOURCE_SHA}" ]]; then
              echo "::error::GitCode release source does not match the frozen tag input." >&2
              exit 1
            fi
            ./scripts/release/verify-remote-tag.sh \
              "https://github.com/${GITHUB_REPOSITORY}.git" "${RELEASE_TAG}" "${SOURCE_SHA}"
            scripts/release/mirror-push.sh gitcode "tag ${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          elif [[ "${GITHUB_REF}" == refs/heads/ci/release-prep-* ]]; then
            scripts/release/mirror-push.sh gitcode "branch ${GITHUB_REF#refs/heads/}" "HEAD:${GITHUB_REF}" --force
          elif [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            echo "::error::GitCode mirrors main and ci/release-prep-* only." >&2
            exit 1
          elif [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            scripts/release/mirror-push.sh gitcode "main" HEAD:refs/heads/main --force
            scripts/release/mirror-push.sh gitcode "release tags" "refs/tags/v*:refs/tags/v*"
          else
            scripts/release/mirror-push.sh gitcode "main" HEAD:refs/heads/main --force
          fi


      - name: Mirror release-prep branches to GitCode
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          for ref in $(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/ci/release-prep-*'); do
            scripts/release/mirror-push.sh gitcode "branch ${ref}" "refs/remotes/origin/${ref}:refs/heads/${ref}" --force
          done
      - name: Mirror the latest release to GitCode
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ -z "$(git ls-remote --tags gitcode "refs/tags/${TAG}")" ]]; then
            scripts/release/mirror-push.sh gitcode "tag ${TAG}" "refs/tags/${TAG}:refs/tags/${TAG}"
          fi
          ./scripts/release/verify-remote-tag.sh gitcode "${TAG}" "$(git rev-parse "refs/tags/${TAG}^{commit}")"
