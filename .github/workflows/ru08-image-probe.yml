name: ru08-image-probe
on:
  push:
    branches: ['ci/ru-08**']
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build release Dockerfile
        run: docker buildx build --platform ${{ matrix.platform }} -f Dockerfile --progress=plain . 
      - name: Build devcontainer image
        run: docker buildx build -f .devcontainer/Dockerfile --build-arg RUST_VERSION=1.100.0 --progress=plain .
