name: Sync to CNB

# Mirror commits and release tags to cnb.cool/codewhale.net/codewhale
# so users behind GitHub-blocking networks can fetch the source and tagged
# releases from the Tencent-hosted mirror.
#
# Main pushes mirror to CNB unless the repository variable CNB_MIRROR is
# "disabled"; release tags arrive through release.yml; a half-hourly schedule
# re-mirrors main and fails if the latest release is missing on CNB; manual
# dispatch is the fallback.
#
# Why the rewrite (v0.8.31):
#   The previous implementation used the opaque tencentcom/git-sync Docker
#   action, which discovered every local ref via fetch-depth: 0 and tried
#   to push them all — including dependabot/* branches that GitHub had
#   locally. Those follow-on pushes ran without the configured credential
#   helper in scope and failed with
#     `fatal: could not read Username for 'https://cnb.cool'`
#   No concurrency block meant the main-push and tag-push workflow runs
#   that auto-tag.yml fires within seconds of each other raced. About
#   half of recent runs failed for those two reasons combined.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    secrets:
      CNB_GIT_TOKEN:
        required: true

# Serialize runs per ref. One global group was wrong: with
# cancel-in-progress: false GitHub still keeps only ONE pending run per group
# and cancels it when a newer one queues, so a release tag sync waiting behind
# a main push was dropped by the next branch push. Keyed by ref, each tag gets
# its own group (never superseded), and a pending branch sync is only ever
# replaced by a newer push of the same branch, whose force-push supersedes it.
# The main and tag pushes from auto-tag.yml write different CNB refs, so
# running them concurrently cannot conflict.
concurrency:
  group: cnb-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.repository_owner == 'codewhale-hq' && ((github.event_name != 'push' && github.event_name != 'schedule') || vars.CNB_MIRROR != 'disabled')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Push triggering ref to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_GIT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::error::CNB_GIT_TOKEN secret is not set; cannot push to CNB." >&2
            exit 1
          fi

          # URL-encode any '%' in the token so basic-auth doesn't break on
          # special characters. CNB tokens are typically alphanumeric so
          # this is belt-and-suspenders.
          ENCODED_TOKEN="$(printf '%s' "${CNB_TOKEN}" | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=""))')"
          REMOTE_URL="https://cnb:${ENCODED_TOKEN}@cnb.cool/codewhale.net/codewhale.git"
          # Use a masked alias so the token never appears in log lines.
          git remote add cnb "${REMOTE_URL}"

          if [[ -n "${RELEASE_TAG}" || "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${RELEASE_TAG:-${GITHUB_REF#refs/tags/}}"
            # The tag starts CNB's public release pipeline. Require the
            # canonical release even for a manual recovery dispatch.
            if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
                [[ "$(git rev-parse 'HEAD^{commit}')" != "${SOURCE_SHA}" ]]; then
              echo "::error::CNB release source does not match the frozen tag input." >&2
              exit 1
            fi
            ./scripts/release/verify-remote-tag.sh \
              "https://github.com/${GITHUB_REPOSITORY}.git" "${TAG}" "${SOURCE_SHA}"
            node scripts/release/verify-release-inventory.js --manifest "${GITHUB_REPOSITORY}" "${TAG}"
            scripts/release/mirror-push.sh cnb "tag ${TAG}" "refs/tags/${TAG}:refs/tags/${TAG}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            # Plain --force. The CNB mirror is one-way by design —
            # nothing else pushes to it, so there's no contributor work
            # to protect against. `--force-with-lease` would be safer
            # in a multi-writer scenario, but in our setup the lease
            # check requires `refs/remotes/cnb/main` to exist in the
            # runner's local clone, which it never does (we add `cnb`
            # as a fresh remote in this step and don't fetch first).
            # That made the lease check spuriously fail with
            # `! [rejected] HEAD -> main (stale info)` even when CNB
            # was actually behind GitHub.
            scripts/release/mirror-push.sh cnb "main" HEAD:refs/heads/main --force
          else
            # First-party fix/rebrand/release branches are first-class CNB
            # sources for heavy Linux CI, release preflight, and
            # Lighthouse/Feishu bootstrap.
            # Mirror the triggering branch exactly so the CNB clone path stays
            # useful before the branch has merged to main or become a release
            # tag.
            BRANCH="${GITHUB_REF#refs/heads/}"
            scripts/release/mirror-push.sh cnb "branch ${BRANCH}" "HEAD:refs/heads/${BRANCH}" --force
          fi

      - name: Verify the latest release reached CNB
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          ./scripts/release/verify-remote-tag.sh cnb "${TAG}" "$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! curl -fsSL --retry 3 -o /dev/null \
              "https://cnb.cool/codewhale.net/codewhale/-/releases/download/${TAG}/codewhale-artifacts-sha256.txt"; then
            echo "::error::CNB release ${TAG} has no codewhale-artifacts-sha256.txt; recover its CNB tag build (docs/CNB_MIRROR.md)." >&2
            exit 1
          fi
