name: Codewhale PR Review

# Account-backed, advisory findings. Failed execution stays visibly failed;
# do not make this optional review job a required merge check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Same-repository PR to review at its current revision
        required: true
        type: string

concurrency:
  group: codewhale-review-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true

jobs:
  codewhale-review:
    name: Codewhale review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_APP_KEY: ${{ secrets.CODEWHALE_APP_PRIVATE_KEY != '' }}
    steps:
      # The local action is trusted base/default-branch source. Candidate PR
      # source is fetched as Git objects by the action and is never executed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Mint Codewhale Agent token
        if: env.HAS_APP_KEY == 'true' && vars.CODEWHALE_APP_ID != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft))
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CODEWHALE_APP_ID }}
          private-key: ${{ secrets.CODEWHALE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Review with the account model
        id: review
        uses: ./
        with:
          version: ${{ vars.CODEWHALE_REVIEW_VERSION || 'v0.10.2' }}
          provider: codewhale
          model: ${{ vars.CODEWHALE_REVIEW_MODEL }}
          pr-number: ${{ inputs.pr-number }}
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          max-chars: ${{ vars.CODEWHALE_REVIEW_MAX_CHARS || '200000' }}
          max-passes: ${{ vars.CODEWHALE_REVIEW_MAX_PASSES || '1' }}
          max-output-tokens: ${{ vars.CODEWHALE_REVIEW_MAX_OUTPUT_TOKENS }}
        env:
          CODEWHALE_API_KEY: ${{ (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CODEWHALE_API_KEY || '' }}
      - name: Save review outcome
        if: always() && steps.review.outputs.receipt != ''
        uses: actions/upload-artifact@v7
        with:
          name: codewhale-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.review.outputs.receipt }}
          retention-days: 14
          if-no-files-found: error
