[package]
name = "codewhale-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Config schema and precedence model for Codewhale"

[lints]
workspace = true

[features]
schema = ["dep:schemars"]
test-support = []

[dependencies]
codewhale-protocol = { path = "../protocol", version = "0.10.2" }
anyhow.workspace = true
base64 = "0.23.1"
chrono.workspace = true
ring = "0.17.14"
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
semver.workspace = true
schemars = { version = "1.2.1", optional = true, features = ["derive", "preserve_order"] }
codewhale-execpolicy = { path = "../execpolicy", version = "0.10.2" }
codewhale-paths = { path = "../paths", version = "0.10.2" }
codewhale-secrets = { path = "../secrets", version = "0.10.2" }
fd-lock = "4.0.4"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url = "2.5"
tempfile.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]
serde_json.workspace = true
