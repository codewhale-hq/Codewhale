[package]
name = "codewhale-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Agentic terminal facade for open-source and open-weight coding models"

[lints]
workspace = true

[features]
default = ["mimalloc-allocator"]
mimalloc-allocator = ["dep:mimalloc"]
# Opt-in global-allocator swap (#5872): build on rusty_alloc (the pure-Rust
# mimalloc v2.4.5 remake — no C compiler, no build script) instead of the
# default mimalloc. Off by default; the default build is unchanged.
# Build with: cargo build -p codewhale-cli --no-default-features --features rusty-alloc
rusty-alloc = ["dep:rusty_alloc-api"]

[[bin]]
name = "codewhale"
path = "src/main.rs"

[dependencies]
codewhale-runtime = { path = "../runtime", version = "0.10.2" }
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
codewhale-tui = { path = "../tui", version = "0.10.2", default-features = false }
codewhale-app-server = { path = "../app-server", version = "0.10.2" }
codewhale-config = { path = "../config", version = "0.10.2" }
codewhale-lane = { path = "../lane", version = "0.10.2" }
codewhale-workflow = { path = "../workflow", version = "0.10.2" }
codewhale-execpolicy = { path = "../execpolicy", version = "0.10.2" }
codewhale-paths = { path = "../paths", version = "0.10.2" }
codewhale-release = { path = "../release", version = "0.10.2" }
codewhale-secrets = { path = "../secrets", version = "0.10.2" }
codewhale-state = { path = "../state", version = "0.10.2" }
codewhale-telemetry = { path = "../telemetry", version = "0.10.2" }
chrono.workspace = true
console = "0.16.3"
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rustls.workspace = true
semver.workspace = true
tokio.workspace = true
mimalloc = { workspace = true, optional = true }
rusty_alloc-api = { workspace = true, optional = true }
sha2.workspace = true
tempfile.workspace = true
tracing.workspace = true
webbrowser = "1.0"
zeroize = "1.8.2"

[build-dependencies]
codewhale-build-support = { path = "../build-support", version = "0.10.2" }

# Parent-death cleanup for delegated server children (#3259): on Linux the
# dispatcher sets PR_SET_PDEATHSIG so the child is signalled if the dispatcher
# dies uncatchably; on Windows it assigns the child to a kill-on-job-close Job
# Object. Also used in main.rs to reset SIGPIPE to SIG_DFL on any Unix target
# (#4030), so libc must be available across all Unix, not just Linux.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
