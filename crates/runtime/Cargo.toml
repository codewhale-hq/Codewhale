[package]
name = "codewhale-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless Codewhale runtime, split out of the terminal UI one module at a time; no terminal UI dependency"

[lints]
workspace = true

# Test helpers (process-global state guards, snapshots, diff renders) that
# the TUI's tests use. It only *adds* `pub` items; it changes no behavior.
# The TUI enables it from [dev-dependencies] only, so `-p codewhale-cli` /
# `-p codewhale-tui` release builds never see it; a `--workspace
# --all-features` build does, which is harmless for helpers.
#
# `test-thread-scoped-state` is the one behavior switch: it makes the retry
# banner and the provider-wide `Retry-After` pause per-thread so concurrent
# tests cannot see each other's HTTP retries (see `retry_status`). It takes
# effect only with debug assertions, so no optimized build ever carries it,
# even under `--all-features`.
[features]
test-support = []
test-thread-scoped-state = []

[lib]
name = "codewhale_runtime"
path = "src/lib.rs"

# This crate must never depend on codewhale-tui, codewhale-cli, ratatui,
# crossterm, ansi-to-tui or a terminal component kit.
# scripts/check-command-crate-boundaries.py enforces that with `cargo tree -p`.
[dependencies]
ahash = "0.8"
anyhow.workspace = true
chrono.workspace = true
codewhale-command-contract = { path = "../command-contract", version = "0.10.2" }
codewhale-config = { path = "../config", version = "0.10.2" }
codewhale-core = { path = "../core", version = "0.10.2" }
codewhale-execpolicy = { path = "../execpolicy", version = "0.10.2" }
codewhale-lane = { path = "../lane", version = "0.10.2" }
codewhale-memory = { path = "../memory", version = "0.10.2" }
codewhale-models = { path = "../models", version = "0.10.2" }
codewhale-palette = { path = "../palette", version = "0.10.2", default-features = false }
colored = "3.0.0"
fd-lock = "4.0.4"
lru = "0.18"
regex = "1.11"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.16", features = ["io"] }
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
codewhale-models = { path = "../models", version = "0.10.2", features = [
    "test-support",
] }
tempfile.workspace = true
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
