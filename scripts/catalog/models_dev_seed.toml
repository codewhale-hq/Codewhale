# Offline Models.dev seed spec (#6396).
#
# This file says WHICH upstream rows the offline seed carries and how they map
# onto Codewhale provider ids. It never states a value that contradicts
# upstream: policy (a withheld price, a clamped limit) belongs in
# crates/config/assets/catalog_corrections.json, which applies online too.
#
#   python3 scripts/catalog_models_dev.py seed lock --dry-run   # review report
#   python3 scripts/catalog_models_dev.py seed lock             # pin upstream
#   python3 scripts/catalog_models_dev.py seed render           # write the seed
#
# Model entries: a bare id, or a table with
#   id           Codewhale wire id (the seed key, sent on the wire)
#   upstream_id  upstream id when it differs by more than letter case
#   from         a sibling upstream provider to take the row from
#   base_model   legacy canonical join; must agree with upstream canonical_model_id
#   curated      true for a row upstream does not list; data in [[curated]]
# Exactly one model per provider is its `default`, matching the provider's
# built-in DEFAULT_*_MODEL.

[source]
url = "https://models.dev/catalog.json"

[meta]
about = "Offline fallback Models.dev-shaped catalog snapshot for Codewhale (#3385, demoted by #4188, generated since #6396)."
schema = "Matches crates/config/src/models_dev.rs ModelsDevCatalog ({ models, providers })."
compatibility_fallback = "Legacy Together and Fireworks defaults and previously reviewed curated IDs retain their dated metadata when absent upstream; they do not prove current availability. See each curated reason. Refreshed provider/catalog rows and explicit configuration remain authoritative."
role = "NOT a competing source of truth. Preferred metadata is the live Models.dev catalog published into ProviderLake (#4187). This asset is used only when live/cache rows are unavailable (offline startup, failed refresh, or empty cache)."
source = "Rows are projected unedited from Models.dev onto the fields models_dev.rs reads; provider headers, id mapping, defaults and canonical joins come from scripts/catalog/models_dev_seed.toml."
corrections = "Deliberate holds (withheld prices, clamped limits) are not in this file. They live in crates/config/assets/catalog_corrections.json and apply to this seed and to live refresh alike."
default_rows = "Each provider's `default: true` wire id equals that provider's built-in DEFAULT_*_MODEL so RouteResolver::new() and the descriptor stay in agreement when offline."
pending_release_metadata = "GLM-5.3 is live on the Z.ai Coding Plan (docs.z.ai/devpack/overview and docs.z.ai/devpack/latest-model, recorded 2026-08-13) and is the default direct Z.ai model (DEFAULT_ZAI_MODEL); explicit GLM-5.2 selections keep their own id. First-party wire id is GLM-5.3; OpenRouter mirror is z-ai/glm-5.3. Capability/limit/dialect values still inherit from GLM-5.2 until Z.ai publishes distinct 5.3 numbers. Pricing stays absent: Coding Plan publishes credit multipliers, not a USD PAYG row we can stand behind. Z.ai may auto-route GLM-5.2/GLM-5.1 requests to GLM-5.3 on their side; Codewhale still sends the selected picker id. Do not send a [1m] suffix. Scope stays first-party Z.ai plus the OpenRouter mirror; add third-party gateway rows only against that gateway's own published roster."

# Canonical entries retain the upstream lab/model identities; provider wire
# ids and configured model selections stay in their own provider rows.

